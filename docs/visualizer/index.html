n Target", "mode": "eval() + param.detach_()", "grad": false, "update_rule": "EMA: θ'_t = α_t θ'_{t-1} + (1 - α_t) θ_t (only when AMP grad is finite)", "color": "purple"}], "nodes": [{"id": "dataset_sampler", "title": "BHSDDataset & TwoStreamBatchSampler", "subtitle": "Anti-Leakage Crop + [Labeled | Unlabeled]", "category": "data", "x": 40, "y": 195, "w": 225, "h": 95, "code_ref": "anti_leakage_crop", "secondary_code_ref": "two_stream_sampler", "shape_key": "batch_input", "grad_state": "no_grad", "summary": "Đọc volume .h5, xóa nhãn thật của mẫu Unlabeled (label = 0) TRƯỚC khi gọi RandomCrop (33% foreground oversampling chỉ tác động lên mẫu Labeled). Ghép B_L mẫu Labeled và B_U mẫu Unlabeled.", "details": ["Tầng Shared 3D Transform (CPU): RandomRotFlip -> RandomScaling3D(0.85..1.15, p=0.2) -> GammaTransform(0.7..1.5, p=0.2) -> GaussianBlur3D(0.5..1.0, p=0.15) -> RandomCrop(patch_size) -> ToTensor().", "Cả Student và Teacher đều nhận CÙNG một patch 3D đã căn chỉnh hình học từ bước này (không bị lệch tọa độ voxel).", "Nếu DDP bật (world_size=2): DistributedTwoStreamBatchSampler chia đều global_batch_size cho mỗi GPU."]}, {"id": "student_perturb", "title": "Asymmetric Input Perturbation", "subtitle": "X_s = X * scale + noise (Student only)", "category": "transform", "x": 315, "y": 75, "w": 225, "h": 88, "code_ref": "mt_train_step", "shape_key": "student_input", "grad_state": "no_grad", "summary": "Chỉ làm nhiễu đầu vào của Student bằng biến đổi cường độ (±5%) và nhiễu cộng Gaussian (σ=0.02). Teacher nhận trực tiếp volume_batch sạch.", "details": ["scale = 1.0 + (rand(B, 1, 1, 1, 1) * 2 - 1) * student_intensity_scale (shape: [B,1,1,1,1])", "noise = randn_like(volume_batch) * student_noise_std (shape: [B,1,Z,Y,X])", "Mục đích: Phá vỡ đối xứng Student-Teacher, buộc Student học đặc trưng bất biến với nhiễu xạ CT mà không làm mờ nhãn giả của Teacher."]}, {"id": "student_net", "title": "Student Network (self.model)", "subtitle": "nnUNet3D (7 Stages) • train() • AMP FP16", "category": "model_trainable", "x": 590, "y": 65, "w": 240, "h": 105, "code_ref": "nnunet_arch", "secondary_code_ref": "mt_train_step", "shape_key": "student_outputs", "grad_state": "requires_grad", "summary": "Chạy forward trên toàn bộ batch (B_L + B_U) đã nhiễu. Khi deep_supervision=True, trả về dict {'seg': student_logits, 'aux': [ds2, ds3, ds4, ds5, ds6]}.", "details": ["7 tầng kênh đặc trưng: [32, 64, 128, 256, 320, 320, 320].", "Anisotropic kernels (1,3,3) ở enc1, enc2, dec2, dec1; Strides (1,2,2) ở pool1, pool2, pool5, pool6; Strides (2,2,2) ở pool3, pool4.", "Trục Z chỉ giảm 4 lần (28 -> 7), trục Y và X giảm 64 lần (256 -> 4)."]}, {"id": "teacher_net", "title": "EMA Teacher (self.ema_model)", "subtitle": "Detached Clone • eval() • torch.no_grad()", "category": "model_ema", "x": 590, "y": 300, "w": 240, "h": 105, "code_ref": "mt_init", "secondary_code_ref": "mt_train_step", "shape_key": "teacher_outputs", "grad_state": "detached", "summary": "Bản sao deepcopy(raw_net) đã gọi param.detach_() và đặt cố định ở eval(). Chạy trong khối with torch.no_grad() trên volume_batch SẠCH.", "details": ["Vì self.ema_model.training == False, nnUNet3D mặc định chỉ trả về tensor final_conv (bỏ qua 5 nhánh aux) trừ khi truyền return_all_scales=True.", "Trong mean_teacher.yaml, consistency_multiscale=False nên Teacher chỉ xuất teacher_logits (B, 6, Z, Y, X), tiết kiệm VRAM và tốc độ.", "Không bao giờ nhận gradient từ loss.backward()."]}, {"id": "sup_loss", "title": "Multi-Scale Supervised Loss", "subtitle": "Sliced [:labeled_bs] • 0.5*(CE + FG_Dice) • 6 Scales", "category": "loss_sup", "x": 890, "y": 45, "w": 255, "h": 110, "code_ref": "mt_train_step", "secondary_code_ref": "deep_supervision", "shape_key": "sup_loss_tensors", "grad_state": "requires_grad", "summary": "Cắt lát [:self.labeled_bs] từ student_logits và 5 đầu ra phụ student_aux. Nội suy trilinear các đầu ra phụ về (Z, Y, X) và tính tổng có trọng số chuẩn hóa w̃_k.", "details": ["Tại mỗi tỉ lệ k: L_stage^(k) = 0.5 * CrossEntropy(aux_lab, lab_targets) + 0.5 * MaskDiceLoss(aux_lab, lab_targets).", "MaskDiceLoss(include_background=False) loại bỏ lớp 0 (Background) khỏi trung bình Dice để tập trung vào 5 lớp xuất huyết.", "Trọng số chuẩn hóa 6 tỉ lệ: [0.5079, 0.2540, 0.1270, 0.0635, 0.0317, 0.0159]."]}, {"id": "cons_loss", "title": "Hybrid Consistency Loss", "subtitle": "Full Batch [0..B-1] • 0.5*FG_SoftDice + 0.5*Weighted_MSE", "category": "loss_cons", "x": 890, "y": 195, "w": 255, "h": 115, "code_ref": "consistency_loss", "secondary_code_ref": "mt_consistency_schedule", "shape_key": "cons_loss_tensors", "grad_state": "requires_grad", "summary": "So khớp phân phối xác suất FP32 Softmax của Student và Teacher trên TOÀN BỘ batch (cả Labeled + Unlabeled). Nhân với trọng số động w_cons(t) có Sigmoid Ramp-up + Cosine Ramp-down.", "details": ["Ép kiểu .float() (FP32) trước F.softmax(dim=1) để tránh underflow FP16.", "50% Continuous Foreground Soft Dice trên 5 kênh tổn thương [:, 1:] (bỏ kênh 0 Background).", "50% Class-Balanced MSE trên 6 kênh với class_weights = [0.05, 1, 1, 1, 1, 1] (giảm 20 lần áp lực từ Background)."]}, {"id": "grad_opt", "title": "GradientHandler & Optimizer", "subtitle": "AMP Unscale • DDP Finite Check • Clip 12.0 • SGD", "category": "optimizer", "x": 890, "y": 345, "w": 255, "h": 95, "code_ref": "gradient_handler", "secondary_code_ref": "lr_scheduler", "shape_key": "optimizer_state", "grad_state": "backward_sink", "summary": "Lan truyền ngược từ L_total = L_sup + w_cons(t)*L_cons về Student. Kiểm tra isfinite trên mọi GPU DDP, clip_grad_norm_(12.0), cập nhật SGD rồi kích hoạt hook EMA.", "details": ["Nếu bất kỳ GPU nào có grad Inf/NaN (is_finite == 0): Bỏ qua cả scaler.step(optimizer) VÀ bỏ qua after_optimizer_step (bảo vệ EMA Teacher).", "Learning Rate cập nhật mỗi iteration theo hàm đa thức: lr(t) = base_lr * (1 - t/T_max)^poly_power (poly_power = 0.7)."]}, {"id": "val_sliding", "title": "3D Gaussian Sliding-Window Validation", "subtitle": "Evaluates EMA Teacher • Stride Z=8, XY=32", "category": "validation", "x": 315, "y": 310, "w": 225, "h": 90, "code_ref": "mt_validate", "secondary_code_ref": "ema_update_fn", "shape_key": "validation_state", "grad_state": "no_grad", "summary": "Định kỳ mỗi val_interval (200 bước), đánh giá trọng số của EMA Teacher (không phải Student) bằng cửa sổ trượt 3D có mặt nạ Gaussian (σ = 1/8 patch_size).", "details": ["Lưu cả state_dict của Student ('net') và Teacher ('ema_net') vào best_model.pth & checkpoint_latest.pth.", "Khi evaluate.py hoặc load_checkpoint(..., prefer_ema=True) chạy, hệ thống tự động nạp 'ema_net'."]}], "edges": [{"id": "e1", "from": "dataset_sampler", "to": "student_perturb", "label": "volume_batch (Clean)", "kind": "data"}, {"id": "e2", "from": "dataset_sampler", "to": "teacher_net", "label": "volume_batch (Clean [0..B-1])", "kind": "data"}, {"id": "e3", "from": "student_perturb", "to": "student_net", "label": "student_input (Perturbed)", "kind": "data"}, {"id": "e4", "from": "dataset_sampler", "to": "sup_loss", "label": "label_batch[:B_L]", "kind": "label"}, {"id": "e5", "from": "student_net", "to": "sup_loss", "label": "student_logits[:B_L] + aux[:B_L]", "kind": "forward_grad"}, {"id": "e6", "from": "student_net", "to": "cons_loss", "label": "student_logits [0..B-1]", "kind": "forward_grad"}, {"id": "e7", "from": "teacher_net", "to": "cons_loss", "label": "teacher_logits [0..B-1] (no_grad)", "kind": "forward_nograd"}, {"id": "e8", "from": "sup_loss", "to": "grad_opt", "label": "L_supervised", "kind": "loss_grad"}, {"id": "e9", "from": "cons_loss", "to": "grad_opt", "label": "w_cons(t) * L_consistency", "kind": "loss_grad"}, {"id": "e10", "from": "grad_opt", "to": "student_net", "label": "∇_θ L_total (SGD Update)", "kind": "backward_grad"}, {"id": "e11", "from": "student_net", "to": "teacher_net", "label": "EMA: α_t θ' + (1-α_t)θ", "kind": "ema_transfer"}, {"id": "e12", "from": "teacher_net", "to": "val_sliding", "label": "ema_model weights", "kind": "validation"}], "execution_steps": [{"step": 1, "title": "Two-Stream Batch Assembly & Anti-Leakage 3D Crop", "code_line": "methods/base_method.py:611 & data/dataset_bhsd.py:218", "active_nodes": ["dataset_sampler"], "active_edges": [], "what_happens": "DataLoader lấy B_L mẫu từ primary_indices (Labeled) và B_U mẫu từ secondary_indices (Unlabeled). Trong BHSDDataset.__getitem__, nhãn của mẫu Unlabeled bị gán bằng 0 TRƯỚC khi qua RandomCrop(foreground_prob=0.33). Nhờ đó, 33% crop tập trung vào vùng xuất huyết chỉ áp dụng trên mẫu Labeled, còn mẫu Unlabeled được crop ngẫu nhiên thuần túy.", "key_formula": "X \\in \\mathbb{R}^{(B_L + B_U) \\times 1 \\times Z \\times Y \\times X}, \\quad Y_{[B_L : B]} \\equiv 0"}, {"step": 2, "title": "Teacher Clean Forward Pass (torch.no_grad + eval mode)", "code_line": "methods/mean_teacher.py:118-123", "active_nodes": ["dataset_sampler", "teacher_net"], "active_edges": ["e2"], "what_happens": "Volume sạch (chưa cộng nhiễu Gaussian hay scale cường độ) đi qua self.ema_model trong ngữ cảnh torch.no_grad() và AMP autocast. Vì consistency_multiscale=False trong cấu hình chuẩn, Teacher chỉ tính đầu ra độ phân giải gốc teacher_logits (B, 6, Z, Y, X).", "key_formula": "Z_T = f_{\\theta'}^{\\text{eval}}(X_{\\text{clean}}) \\in \\mathbb{R}^{B \\times 6 \\times Z \\times Y \\times X} \\quad (\\text{no\\_grad})"}, {"step": 3, "title": "Asymmetric Student Perturbation & Multi-Scale Forward", "code_line": "methods/mean_teacher.py:126-135", "active_nodes": ["student_perturb", "student_net"], "active_edges": ["e1", "e3"], "what_happens": "Khi perturb_student=True, mỗi mẫu trong batch được nhân với hệ số cường độ ngẫu nhiên scale ∈ [0.95, 1.05] và cộng nhiễu Gaussian N(0, 0.02²). Mạng Student (ở chế độ train()) chạy forward sinh ra student_logits (tỉ lệ 1x) cùng 5 tensor phụ student_aux[0..4] từ các tầng giải mã d2..d6.", "key_formula": "X_S = X_{\\text{clean}} \\odot s + \\epsilon, \\quad \\{Z_S^{(0)}, Z_S^{(1..5)}\\} = f_{\\theta}^{\\text{train}}(X_S)"}, {"step": 4, "title": "Multi-Scale Supervised Loss on Labeled Slice [:labeled_bs]", "code_line": "methods/mean_teacher.py:138-160", "active_nodes": ["student_net", "sup_loss"], "active_edges": ["e4", "e5"], "what_happens": "Cắt B_L mẫu đầu tiên từ student_logits và 5 đầu ra phụ student_aux. Các đầu ra phụ có độ phân giải thấp hơn (ví dụ 7×8×8 ở ds_conv6) được phóng đại bằng F.interpolate(mode='trilinear') về đúng (Z, Y, X). Tính trung bình 0.5*CE + 0.5*MaskDice(loại bỏ Background) tại mỗi tỉ lệ rồi nhân với trọng số chuẩn hóa w̃_k = 2⁻ᵏ / ∑2⁻ʲ.", "key_formula": "\\mathcal{L}_{\\text{sup}} = \\sum_{k=0}^{5} \\tilde{w}_k \\cdot \\frac{1}{2}\\Big(\\mathcal{L}_{\\text{CE}}(\\uparrow Z_{S, [:B_L]}^{(k)}, Y_{[:B_L]}) + \\mathcal{L}_{\\text{Dice}}^{c \\ge 1}(\\uparrow Z_{S, [:B_L]}^{(k)}, Y_{[:B_L]})\\Big)"}, {"step": 5, "title": "Hybrid Consistency Loss Across Full Batch [0..B-1]", "code_line": "methods/mean_teacher.py:163 & losses/consistency.py:63-107", "active_nodes": ["student_net", "teacher_net", "cons_loss"], "active_edges": ["e6", "e7"], "what_happens": "Ép cả student_logits và teacher_logits (toàn bộ B_L + B_U mẫu) về FP32 (.float()) rồi lấy Softmax theo chiều kênh. Tính 50% Continuous Foreground Soft Dice (chỉ trên 5 lớp xuất huyết 1..5) + 50% Class-Balanced MSE (trọng số lớp [0.05, 1, 1, 1, 1, 1] giảm 20 lần ảnh hưởng của Background).", "key_formula": "\\mathcal{L}_{\\text{cons}} = 0.5 \\cdot \\mathcal{L}_{\\text{SoftDice}}(P_S^{1..5}, P_T^{1..5}) + 0.5 \\cdot \\frac{\\sum_{c=0}^5 w_c \\cdot \\text{MSE}_c(P_{S,c}, P_{T,c})}{\\sum_{c=0}^5 w_c}"}, {"step": 6, "title": "Dynamic Consistency Weighting & Total Loss Combination", "code_line": "methods/mean_teacher.py:94-110, 175-177", "active_nodes": ["sup_loss", "cons_loss", "grad_opt"], "active_edges": ["e8", "e9"], "what_happens": "Tính hệ số w_cons(t): tăng theo đường cong Sigmoid trong giai đoạn ramp-up (theo iter nếu rampup > 100, theo epoch nếu <= 100), giữ đỉnh ở consistency (0.05), và suy giảm Cosine từ bước consistency_rampdown_start (7800) về 25% giá trị đỉnh ở cuối quá trình huấn luyện để chống pseudo-label drift trên các lớp hiếm (IVH/SAH).", "key_formula": "\\mathcal{L}_{\\text{total}} = \\mathcal{L}_{\\text{sup}} + w_{\\text{cons}}(t) \\cdot \\mathcal{L}_{\\text{cons}}"}, {"step": 7, "title": "AMP Scaled Backward, DDP Finite Consensus, Clip 12.0 & SGD Step", "code_line": "training/gradient_handler.py:51-88", "active_nodes": ["grad_opt", "student_net"], "active_edges": ["e10"], "what_happens": "GradScaler nhân scale vào L_total và gọi backward(). Đạo hàm CHỈ chảy ngược về Student (Teacher bị chặn bởi detach_ và no_grad). Sau khi unscale_(), các GPU đồng bộ all_reduce(MIN) để kiểm tra không có gradient Inf/NaN. Nếu toàn bộ hữu hạn: cắt chuẩn gradient ở max_norm=12.0 và cập nhật trọng số Student bằng SGD.", "key_formula": "\\text{if } \\bigwedge_{\\text{rank}} \\text{isfinite}(\\nabla_\\theta \\mathcal{L}): \\quad g \\leftarrow \\text{ClipNorm}(\\nabla_\\theta \\mathcal{L}, 12.0), \\quad \\theta_t \\leftarrow \\text{SGD}(\\theta_{t-1}, g, \\text{lr}_t)"}, {"step": 8, "title": "Cosine EMA Teacher Update & Periodic Sliding-Window Validation", "code_line": "methods/mean_teacher.py:191-195 & methods/ssl_utils.py:93-120", "active_nodes": ["student_net", "teacher_net", "val_sliding"], "active_edges": ["e11", "e12"], "what_happens": "Chỉ khi bước SGD ở Step 7 thành công, hook after_optimizer_step mới được gọi. Hệ số α_t được tính theo lịch Cosine từ 0.99 lên 0.999, cập nhật mọi parameter của Teacher: θ'_t = α_t θ'_{t-1} + (1 - α_t) θ_t và copy trực tiếp các buffer. Mỗi val_interval bước, EMA Teacher được đem đi đánh giá bằng cửa sổ trượt 3D Gaussian.", "key_formula": "\\theta'_t \\leftarrow \\alpha_t \\theta'_{t-1} + (1 - \\alpha_t) \\theta_t, \\quad \\alpha_t = 0.99 + (\\alpha_{\\max} - 0.99)\\frac{1 - \\cos(\\pi t / T_{\\max})}{2}"}], "paper_vs_impl": [{"dimension": "Không gian & Đầu ra", "paper": "Phân loại ảnh 2D (CIFAR-10, ImageNet) — đầu ra vector [B, C].", "impl": "Phân đoạn thể tích CT 3D 6 lớp [B, 6, Z, Y, X] kèm 5 đầu ra phụ Deep Supervision (d2..d6).", "impact": "Đòi hỏi xử lý bất đẳng hướng trục Z (anisotropic kernels/strides) và nội suy trilinear 3D."}, {"dimension": "Chiến lược Nhiễu (Perturbation)", "paper": "Nhiễu đối xứng độc lập trên cả Student và Teacher (dịch chuyển + Gaussian noise + Dropout ở cả 2 mạng).", "impl": "Nhiễu bất đối xứng (Asymmetric): Chung biến đổi hình học 3D tại Dataset; Teacher ở eval() nhận ảnh sạch, chỉ Student nhận scale (±5%) + Gaussian noise (σ=0.02).", "impact": "Giữ cho dự đoán của Teacher sắc nét và khớp tọa độ từng voxel 3D với Student, tránh làm nhòe ranh giới xuất huyết mỏng."}, {"dimension": "Hàm Consistency Loss", "paper": "MSE đồng đều trên mọi lớp hoặc KL Divergence.", "impl": "Hybrid Loss: 50% Foreground-only Soft Dice (bỏ kênh 0 Background) + 50% Class-Balanced MSE (bg_consistency_weight = 0.05).", "impact": "Chống sụp đổ mô hình (model collapse về toàn Background) do >98% voxel trong CT sọ não là nền."}, {"dimension": "Lịch Consistency Weight w_cons(t)", "paper": "Chỉ có Sigmoid Ramp-up ở đầu quá trình train rồi giữ cố định.", "impl": "Sigmoid Ramp-up (4000 iters) + Plateau + Late-Stage Cosine Ramp-down (từ iter 7800 giảm về 25% ở iter 12000).", "impact": "Ngăn chặn confirmation bias / pseudo-label drift ở giai đoạn cuối đối với các lớp hiếm (IVH, SAH)."}, {"dimension": "Lịch Hệ số EMA α_t", "paper": "Hằng số α = 0.99/0.999 hoặc min(1 - 1/(t+1), α).", "impl": "Cosine EMA Schedule tăng mượt từ min_alpha = 0.99 lên ema_decay = 0.999 theo tiến độ t / T_max.", "impact": "Giúp Teacher học nhanh ở giai đoạn đầu (cửa sổ nhớ ~100 bước) và cực kỳ ổn định ở cuối train (cửa sổ nhớ ~1000 bước)."}]}, "cps": {"id": "cps", "name": "Cross Pseudo Supervision (CPS)", "short_name": "CPS", "badge": "Dual-Network θ₁ ↔ θ₂ • Cross Argmax Pseudo-Labels", "file": "methods/cps.py", "class_name": "CPSMethod", "paper": {"title": "Semi-Supervised Semantic Segmentation with Cross Pseudo Supervision", "authors": "Xiaokang Chen  128 |                 noise = torch.randn_like(volume_batch) * self.student_noise_std\n 129 |                 scale = 1.0 + (torch.rand((volume_batch.shape[0], 1, 1, 1, 1), device=self.device) * 2.0 - 1.0) * self.student_intensity_scale\n 130 |                 student_input = volume_batch * scale + noise\n 131 |             else:\n 132 |                 student_input = volume_batch\n 133 | \n 134 |             # 3. Forward student on perturbed input\n 135 |             student_out = self.model(student_input)\n 136 |             student_logits, student_aux = extract_multiscale_outputs(student_out)\n 137 | \n 138 |             # Supervised loss on labeled samples (0..labeled_bs)\n 139 |             lab_logits = student_logits[:self.labeled_bs]\n 140 |             lab_targets = label_batch[:self.labeled_bs]\n 141 |             loss_ce = F.cross_entropy(lab_logits, lab_targets)\n 142 |             loss_dice = self.dice_loss(lab_logits, lab_targets)\n 143 |             loss_sup_main = (loss_ce + loss_dice) / 2.0\n 144 | \n 145 |             # Multi-scale deep supervision on labeled samples\n 146 |             loss_ds_accum = 0.0\n 147 |             if self.ds_enabled and len(student_aux) > 0:\n 148 |                 all_student_lab = [lab_logits] + [aux[:self.labeled_bs] for aux in student_aux]\n 149 |                 norm_w = resolve_ds_weights(len(all_student_lab), self.ds_weights)\n 150 |                 loss_supervised = norm_w[0] * loss_sup_main\n 151 |                 target_shape = lab_targets.shape[1:]\n 152 | \n 153 |                 for idx in range(1, len(all_student_lab)):\n 154 |                     aux_lab = all_student_lab[idx]\n 155 |                     if aux_lab.shape[2:] != target_shape:\n 156 |                         aux_lab = F.interpolate(aux_lab, size=target_shape, mode='trilinear', align_corners=False)\n 157 |                     l_stage = (F.cross_entropy(aux_lab, lab_targets) + self.dice_loss(aux_lab, lab_targets)) / 2.0\n 158 |                     loss_supervised = loss_supervised + norm_w[idx] * l_stage\n 159 |                     loss_ds_accum = loss_ds_accum + norm_w[idx] * float(l_stage.item())\n 160 |             else:\n 161 |                 loss_supervised = loss_sup_main\n 162 | \n 163 |             # Consistency loss across full batch via centralized ConsistencyLoss\n 164 |             loss_cons_main = self.consistency_loss(student_logits, teacher_logits)\n 165 | \n 166 |             if self.ds_enabled and self.ds_consistency and len(student_aux) > 0 and len(teacher_aux) == len(student_aux):\n 167 |                 all_student = [student_logits] + student_aux\n 168 |                 all_teacher = [teacher_logits] + teacher_aux\n 169 |                 norm_w = resolve_ds_weights(len(all_student), self.ds_weights)\n 170 |                 loss_consistency = norm_w[0] * loss_cons_main\n 171 |                 for idx in range(1, len(all_student)):\n 172 |                     loss_consistency = loss_consistency + norm_w[idx] * self.consistency_loss(all_student[idx], all_teacher[idx])\n 173 |             else:\n 174 |                 loss_consistency = loss_cons_main\n 175 | \n 176 |             cur_epoch = iter_num / max(len(self.trainloader), 1)\n 177 |             consistency_weight = self.get_current_consistency_weight(iter_num, cur_epoch)\n 178 |             total_loss = loss_supervised + consistency_weight * loss_consistency\n 179 | \n 180 |         loss_dict = {\n 181 |             \"total\": float(total_loss.item()),\n 182 |             \"supervised\": float(loss_supervised.item()),\n 183 |             \"consistency\": float(loss_consistency.item()),\n 184 |             \"weight\": float(consistency_weight)\n 185 |         }\n 186 |         if self.ds_enabled and len(student_aux) > 0:\n 187 |             loss_dict[\"supervised_main\"] = float(loss_sup_main.item())\n 188 |             loss_dict[\"deep_supervision\"] = float(loss_ds_accum)\n 189 | \n 190 |         return total_loss, loss_dict\n 109 |         actual_alpha = min_alpha + (alpha - min_alpha) * 0.5 * (1.0 - math.cos(math.pi * progress))\n 110 |     elif global_step >= 0:\n 111 |         actual_alpha = min(1.0 - 1.0 / (global_step + 1), alpha)\n 112 |     else:\n 113 |         actual_alpha = alpha\n 114 | \n 115 |     with torch.no_grad():\n 116 |         for ema_param, param in zip(ema_model.parameters(), model.parameters()):\n 117 |             ema_param.mul_(actual_alpha).add_(param, alpha=1.0 - actual_alpha)\n 118 |         # Teacher remains in eval mode; its BatchNorm statistics never update by forward.\n 119 |         for ema_buffer, buffer in zip(ema_model.buffers(), model.buffers()):\n 120 |             ema_buffer.copy_(buffer)\n 121 | "}, "consistency_loss": {"path": "losses/consistency.py", "abs_path": "/home/u001015/BHSD_SSL/losses/consistency.py", "start_line": 14, "end_line": 136, "title": "ConsistencyLoss & compute_soft_dice_consistency (Hybrid Soft Dice + Class-Balanced MSE)", "code": "  14 | def compute_soft_dice_consistency(\n  15 |     student_prob: torch.Tensor,\n  16 |     teacher_prob: torch.Tensor,\n  17 |     num_classes: int = 6,\n  18 |     is_binary: bool = False,\n  19 |     conf_mask: Optional[torch.Tensor] = None,\n  20 |     smooth: float = 1e-5\n  21 | ) -> torch.Tensor:\n  22 |     \"\"\"\n  23 |     Continuous Probability-to-Probability Soft Dice Consistency on Foregrounds.\n  24 |     Excludes background (class 0) whenever num_classes > 1 to eliminate background confirmation bias.\n  25 |     \"\"\"\n  26 |     fg_s = student_prob[:, 1:] if num_classes > 1 else student_prob\n  27 |     fg_t = teacher_prob[:, 1:] if num_classes > 1 else teacher_prob\n  28 | \n  29 |     if conf_mask is not None:\n  30 |         fg_s = fg_s * conf_mask\n  31 |         fg_t = fg_t * conf_mask\n  32 | \n  33 |     # Spatial sum over 3D volume (D, H, W)\n  34 |     dims = (2, 3, 4)\n  35 |     intersection = torch.sum(fg_s * fg_t, dim=dims)\n  36 |     cardinality = torch.sum(fg_s ** 2 + fg_t ** 2, dim=dims)\n  37 | \n  38 |     dice_score = (2.0 * intersection + smooth) / (cardinality + smooth)\n  39 |     return 1.0 - torch.mean(dice_score)\n  40 | \n  41 | \n  42 | @LOSSES.register(\"consistency\")\n  43 | class ConsistencyLoss(nn.Module):\n  44 |     \"\"\"\n  45 |     Consistency loss engine for Teacher-Student and Perturbation-based SSL methods.\n  46 |     Supports 'hybrid', 'dice', 'weighted_mse', and 'kl'.\n  47 |     \"\"\"\n  48 |     def __init__(\n  49 |         self,\n  50 |         consistency_type: str = 'hybrid',\n  51 |         num_classes: int = 6,\n  52 |         is_binary: bool = False,\n  53 |         confidence_thresh: float = 0.0,\n  54 |         class_weights: Optional[torch.Tensor] = None\n  55 |     ):\n  56 |         super(ConsistencyLoss, self).__init__()\n  57 |         self.consistency_type = str(consistency_type).lower()\n  58 |         self.num_classes = num_classes\n  59 |         self.is_binary = is_binary\n  60 |         self.confidence_thresh = confidence_thresh\n  61 |         self.class_weights = class_weights\n  62 | \n  63 |     def forward(\n  64 |         self,\n  65 |         student_logits: torch.Tensor,\n  66 |         teacher_logits: torch.Tensor\n  67 |     ) -> torch.Tensor:\n  68 |         student_prob = F.softmax(student_logits.float(), dim=1)\n  69 |         teacher_prob = F.softmax(teacher_logits.float(), dim=1)\n  70 | \n  71 |         # Confidence thresholding with CT foreground preservation\n  72 |         if self.confidence_thresh > 0.0:\n  73 |             if self.num_classes > 1 and not self.is_binary:\n  74 |                 fg_max_prob, _ = torch.max(teacher_prob[:, 1:], dim=1, keepdim=True)\n  75 |                 bg_prob = teacher_prob[:, :1]\n  76 |                 conf_mask = ((fg_max_prob >= min(self.confidence_thresh, 0.4)) | (bg_prob >= self.confidence_thresh)).float()\n  77 |             else:\n  78 |                 max_prob, _ = torch.max(teacher_prob, dim=1, keepdim=True)\n  79 |                 conf_mask = (max_prob >= self.confidence_thresh).float()\n  80 |         else:\n  81 |             conf_mask = None\n  82 | \n  83 |         # 1. Pure Continuous Soft Dice on Foreground Classes\n  84 |         if self.consistency_type == 'dice':\n  85 |             return compute_soft_dice_consistency(\n  86 |                 student_prob, teacher_prob, self.num_classes, self.is_binary, conf_mask=conf_mask\n  87 |             )\n  88 | \n  89 |         # 2. Hybrid Consistency: Soft Dice + Class-balanced Channel MSE\n  90 |         elif self.consistency_type == 'hybrid':\n  91 |             loss_dice = compute_soft_dice_consistency(\n  92 |                 student_prob, teacher_prob, self.num_classes, self.is_binary, conf_mask=conf_mask\n  93 |             )\n  94 |             sq_diff = (student_prob - teacher_prob) ** 2\n  95 |             if conf_mask is not None:\n  96 |                 sq_diff = sq_diff * conf_mask\n  97 |                 mask_sum = conf_mask.sum(dim=(0, 2, 3, 4)) + 1e-6\n  98 |                 mse_per_class = sq_diff.sum(dim=(0, 2, 3, 4)) / mask_sum\n  99 |             else:\n 100 |                 mse_per_class = sq_diff.mean(dim=(0, 2, 3, 4))\n 101 | \n 102 |             if self.class_weights is not None:\n 103 |                 w = self.class_weights.view(-1)\n 104 |                 loss_mse = (mse_per_class * w).sum() / (w.sum() + 1e-6)\n 105 |             else:\n 106 |                 loss_mse = mse_per_class.mean()\n 107 |             return 0.5 * loss_mse + 0.5 * loss_dice\n 108 | \n 109 |         # 3. Class-balanced Channel MSE\n 110 |         elif self.consistency_type in ('weighted_mse', 'mse', 'class_balanced_mse'):\n 111 |             sq_diff = (student_prob - teacher_prob) ** 2\n 112 |             if conf_mask is not None:\n 113 |                 sq_diff = sq_diff * conf_mask\n 114 |                 mask_sum = conf_mask.sum(dim=(0, 2, 3, 4)) + 1e-6\n 115 |                 mse_per_class = sq_diff.sum(dim=(0, 2 _()\n  74 |         self.nclass = nclass\n  75 |         self.smooth = float(smooth)\n  76 |         self.include_background = include_background\n  77 | \n  78 |         if class_weights is None:\n  79 |             weights = torch.ones((1, nclass), dtype=torch.float32)\n  80 |         else:\n  81 |             w_arr = (class_weights.detach().cpu().numpy() if isinstance(class_weights, torch.Tensor)\n  82 |                      else np.asarray(class_weights, dtype=np.float32))\n  83 |             assert w_arr.shape[0] == nclass, (\n  84 |                 f\"class_weights length {w_arr.shape[0]} does not match nclass {nclass}\"\n  85 |             )\n  86 |             weights = torch.from_numpy(w_arr).unsqueeze(0)\n  87 | \n  88 |         if not torch.isfinite(weights).all() or (weights < 0).any() or weights.sum() <= 0:\n  89 |             raise ValueError('Class weights must be finite, nonnegative, and have a positive sum')\n  90 |         self.register_buffer(\"class_weights\", weights)\n  91 | \n  92 |     def _reduce_dice(self, dice):\n  93 |         weights = self.class_weights.to(device=dice.device, dtype=dice.dtype)\n  94 |         if weights.shape[1] != dice.shape[1]:\n  95 |             raise ValueError('Dice loss class count does not match predictions')\n  96 |         if not self.include_background and dice.shape[1] > 1:\n  97 |             dice, weights = dice[:, 1:], weights[:, 1:]\n  98 |         if weights.sum() <= 0:\n  99 |             raise ValueError('Selected foreground classes must have positive total weight')\n 100 |         return 1.0 - (dice * weights).sum() / (weights.sum() * dice.shape[0])\n 101 | "}, "deep_supervision": {"path": "losses/deep_supervision.py", "abs_path": "/home/u001015/BHSD_SSL/losses/deep_supervision.py", "start_line": 13, "end_line": 35, "title": "compute_ds_weights & resolve_ds_weights (Exponential Decay Normalization)", "code": "  13 | def compute_ds_weights(num_scales: int) -> List[float]:\n  14 |     \"\"\"\n  15 | if method != 'supervised' and (local_l < 1 or local_u < 1):\n  34 |         raise ValueError(f'{method} requires labeled and unlabeled samples on every rank.')\n  35 |     if method in ('pick', 'bcp') and (local_l < 2 or local_l % 2 or local_l != local_u):\n  36 |         raise ValueError(\n  37 |             f'{method} requires equal even labeled/unlabeled counts >= 2 per rank '\n  38 |             f'for paired CutMix; got {local_l} labeled + {local_u} unlabeled. '\n  39 |             f'For {world_size} ranks use global batch_size={4 * world_size}, '\n  40 |             f'labeled_bs={2 * world_size} or another valid paired configuration.'\n  41 |         )\n  42 |     return BatchLayout(batch_size, labeled, unlabeled, world_size,\n  43 |                        batch_size // world_size, local_l, local_u)"}, "two_stream_sampler": {"path": "data/samplers.py", "abs_path": "/home/u001015/BHSD_SSL/data/samplers.py", "start_line": 34, "end_line": 75, "title": "TwoStreamBatchSampler (Primary Labeled + Secondary Eternal Unlabeled)", "code": "  34 | class TwoStreamBatchSampler(Sampler):\n  35 |     \"\"\"\n  36 |     Iterate two sets of indices (Primary = Labeled, Secondary = Unlabeled).\n  37 |     An 'epoch' is defined as one full iteration through the primary indices.\n  38 |     The secondary indices are iterated eternally as many times as needed.\n  39 |     \"\"\"\n  40 |     def __init__(\n  41 |         self,\n  42 |         primary_indices: List[int],\n  43 |         secondary_indices: List[int],\n  44 |         batch_size: int,\n  45 |         secondary_batch_size: int\n  46 |     ):\n  47 |         self.primary_indices = list(primary_indices)\n  48 |         self.secondary_indices = list(secondary_indices)\n  49 |         self.secondary_batch_size = secondary_batch_size\n  50 |         self.primary_batch_size = batch_size - secondary_batch_size\n  51 | \n  52 |         assert len(self.primary_indices) >= self.primary_batch_size > 0, (\n  53 |             f\"Primary indices count ({len(self.primary_indices)}) must be >= \"\n  54 |             f\"primary batch size ({self.primary_batch_size}) > 0\"\n  55 |         )\n  56 |         assert len(self.secondary_indices) >= self.secondary_batch_size > 0, (\n  57 |             f\"Secondary indices count ({len(self.secondary_indices)}) must be >= \"\n  58 |             f\"secondary batch size ({self.secondary_batch_size}) > 0\"\n  59 |         )\n  60 | \n  61 |     def __iter__(self) -> Iterator[List[int]]:\n  62 |         primary_iter = iterate_once(self.primary_indices)\n  63 |         secondary_iter = iterate_eternally(self.secondary_indices)\n  64 |         return (\n  65 |             list(primary_batch + secondary_batch)\n  66 |             for (primary_batch, secondary_batch)\n  67 |             in zip(\n  68 |                 grouper(primary_iter, self.primary_batch_size),\n  69 |                 grouper(secondary_iter, self.secondary_batch_size)\n  70 |             )\n  71 |         )\n  72 | \n  73 |     def __len__(self) -> int:\n  74 |         return len(self.primary_indices) // self.primary_batch_size\n  75 | "}, "anti_leakage_crop": {"path": "data/dataset_bhsd.py", "abs_path": "/home/u001015/BHSD_SSL/data/dataset_bhsd.py", "start_line": 218, "end_line": 236, "title": "BHSDDataset.__getitem__ (Zeroing Unlabeled Mask Before Foreground-Oversampled RandomCrop)", "code": " 218 |         if self.labeled_indices is not None and idx not in self.labeled_indices:\n 219 |             label = np.zeros_like(label)\n 220 |         if self.binary:\n 221 |             label = (label > 0).astype(np.uint8)\n 222 |         else:\n 223 |             label = label.astype(np.uint8)\n 224 | \n 225 |         sample = {\n 226 |             'image': image,\n 227 |             'label': label,\n 228 |             'case': case_name\n 229 |         }\n 230 | \n 231 |         if self.split != 'train':\n 232 |             sample['metadata'] = metadata\n 233 | \n 234 |         if self.transform is not is not None and len(fg_coords) > 0:\n  64 |             target_idx = np.random.randint(0, len(fg_coords))\n  65 |             cz, cy, cx = fg_coords[target_idx]\n  66 |             # Center the crop around the selected foreground voxel with random jitter\n  67 |             z1 = int(cz - self.output_size[0] // 2 + np.random.randint(-4, 5))\n  68 |             y1 = int(cy - self.output_size[1] // 2 + np.random.randint(-16, 17))\n  69 |             x1 = int(cx - self.output_size[2] // 2 + np.random.randint(-16, 17))\n  70 |             z1 = max(0, min(z1, z - self.output_size[0]))\n  71 |             y1 = max(0, min(y1, y - self.output_size[1]))\n  72 |             x1 = max(0, min(x1, x - self.output_size[2]))\n  73 |         else:\n  74 |             z1 = np.random.randint(0, max(z - self.output_size[0] + 1, 1))\n  75 |             y1 = np.random.randint(0, max(y - self.output_size[1] + 1, 1))\n  76 |             x1 = np.random.randint(0, max(x - self.output_size[2] + 1, 1))\n  77 | \n  78 |         sample['image'] = image[\n  79 |             z1:z1 + self.output_size[0],\n  80 |             y1:y1 + self.output_size[1],\n  81 |             x1:x1 + self.output_size[2]\n  82 |         ]\n  83 |         sample['label'] = label[\n  84 |             z1:z1 + self.output_size[0],\n  85 |             y1:y1 + self.output_size[1],\n  86 |             x1:x1 + self.output_size[2]\n  87 |         ]\n  88 |         return sample"}, "lr_scheduler": {"path": "core/optimizers.py", "abs_path": "/home/u001015/BHSD_SSL/core/optimizers.py", "start_line": 64, "end_line": 96, "title": "calculate_lr (Polynomial & Cosine Annealing LR with Warmup)", "code": "  64 | def calculate_lr(\n  65 |     iter_num: int,\n  66 |     max_iterations: int,\n  67 |     base_lr: float,\n  68 |     scheduler_type: str = 'poly',\n  69 |     poly_power: float = 0.9,\n  70 |     min_lr: float = 1e-6,\n  71 |     warmup_iters: int = 0\n  72 | ) -> float:\n  73 |     \"\"\"Calculate learning rate at current iteration with optional warmup.\"\"\"\n  74 |     max_iters = max(max_iterations, 1)\n  75 | \n  76 |     # Linear Warmup phase\n  77 |     if warmup_iters > 0 and iter_num < warmup_iters:\n  78 |         alpha = float(iter_num) / float(max(warmup_iters, 1))\n  79 |         return max(base_lr * alpha, min_lr)\n  80 | \n  81 |     eff_iter = iter_num - warmup_iters\n  82 |     eff_max = max(max_iters - warmup_iters, 1)\n  83 | \n  84 |     sched = str(scheduler_type).lower()\n  85 |     if sched == 'poly':\n  86 |         decay = max(1.0 - (eff_iter / eff_max), 0.0) ** poly_power\n  87 |         return max(base_lr * decay, min_lr)\n  88 |     elif sched in ('cosine', 'cosine_annealing'):\n  89 |         progress = min(max(eff_iter / eff_max, 0.0), 1.0)\n  90 |         return max(base_lr * 0.5 * (1.0 + math.cos(math.pi * progress)), min_lr)\n  91 |     elif sched == 'constant':\n  92 |         return base_lr\n  93 |     else:\n  94 |         # Default to poly\n  95 |         decay = max(1.0 - (eff_iter / eff_max), 0.0) ** poly_power\n  96 |         return max(base_lr * decay, min_lr)"}, "cps_train_step": {"path": "methods/cps.py", "abs_path": "/home/u001015/BHSD_SSL/methods/cps.py", "start_line": 90, "end_line": 140, "title": "CPSMethod.train_step (Dual-Network Cross Pseudo Supervision)", "code": "  90 |     def train_step(self, sampled_batch: Dict, iter_num: int, mim_mask: Optional[torch.Tensor] = None) -> Tuple[torch.Tensor, Dict[str, float]]:\n  91 |         volume_batch = sampled_batch['image'].to(self.device)\n  92 |         label_batch = sampled_batch['label'].to(self.device)\n  93 | \n  94 |         # Forward network 1 and network 2\n  95 |         logits1, aux1 = extract_multiscale_outputs(self.model(volume_batch))\n  96 |         logits2, aux2 = extract_multiscale_outputs(self.model2(volume_batch))\n  97 | \n  98 |         # 1. Supervised loss on labeled partition with optional deep supervision\n  99 |         lab_logits1 = logits1[:self.labeled_bs]\n 100 |         lab_logits2 = logits2[:self.labeled_bs]\n 101 |         lab_targets = label_batch[:self.labeled_bs]\n 102 | \n 103 |         aux1_lab = [a[:self.labeled_bs] for a in aux1]\n 104 |         aux2_lab = [a[:self.labeled_bs] for a in aux2]\n 105 | \n 106 |         loss_sup1, ds_accum1 = self._compute_multi_scale_sup_loss(lab_logits1, aux1_lab, lab_targets)\n 107 |         loss_sup2, ds_accum2 = self._compute_multi_scale_sup_loss(lab_logits2, aux2_lab, lab_targets)\n 108 | \n 109 |         # 2. Cross pseudo-labels from argmax predictions\n 110 |         with torch.no_grad():\n 111 |             prob1 = F.softmax(logits1, dim=1)\n 112 |             prob2 = F.softmax(logits2, dim=1)\n 113 |             pl1 = torch.argmax(prob1, dim=1).long()\n 114 |             pl2 = torch.argmax(prob2, dim=1).long()\n 115 | \n 116 |         # 3. Cross supervision loss\n 117 |         loss_cps1 = F.cross_entropy(logits1, pl2)\n 118 |         loss_cps2 = F.cross_entropy(logits2, pl1)\n 119 | \n 120 |         cur_epoch = iter_num / max(len(self.trainloader), 1)\n 121 |         cur_weight = self.cps_weight * sigmoid_rampup(cur_epoch, self.consistency_rampup)\n 122 | \n 123 |         total_loss1 = loss_sup1 + cur_weight * loss_cps1\n 124 |         total_loss2 = loss_sup2 + cur_weight * loss_cps2\n 125 |         total_loss = total_loss1 + total_loss2\n 126 | \n 127 |         loss_dict = {\n 128 |             \"total\": float(total_loss.item()),\n 129 |             \"sup1\": float(loss_sup1.item()),\n 130 |             \"sup2\": float(loss_sup2.item()),\n 131 |             \"cps1\": float(loss_cps1.item()),\n 132 |             \"cps2\": float(loss_cps2.item()),\n 133 |             \"weight\": float(cur_weight)\n 134 |         }\n 135 |         if self.ds_enabled and len(aux1) > 0:\n 136 |             loss_dict[\"ds1\"] = float(ds_accum1)\n 137 |             loss_dict[\"ds2\"] = float(ds_accum2)\n 138 | \n 139 |         return total_loss, loss_dict\n 140 | "}, "bcp_train_step": {"path": "methods/bcp.py", "abs_path": "/home/u001015/BHSD_SSL/methods/bcp.py", "start_line": 33, "end_line": 79, "title": "BCPMethod.train_step (Bidirectional 3D Copy-Paste)", "code": "  33 |     def train_step(self, sampled_batch: Dict, iter_num: int, mim_mask: Optional[torch.Tensor] = None) -> Tuple[torch.Tensor, Dict[str, float]]:\n  34 |         batch = split_ssl_batch(sampled_batch, self.labeled_bs, device=self.device)\n  35 |         img_a, img_b = batch.img_a, batch.img_b\n  36 |         lab_a, lab_b = batch.lab_a, batch.lab_b\n  37 |         unimg = batch.unlabeled_volume\n  38 |         unimg_a, unimg_b = batch.unimg_a, batch.unimg_b\n  39 |         sub_bs = batch.sub_bs\n  40 | \n  41 |         # Pseudo-labeling unlabeled images\n  42 |         with torch.no_grad():\n  43 |             un_logits = extract_logits(self.model(unimg))\n  44 |             un_prob = F.softmax(un_logits, dim=1)\n  45 |             plab = torch.argmax(un_prob, dim=1).long()\n  46 |             plab_a, plab_b = plab[:sub_bs], plab[sub_bs:]\n  47 | \n  48 |             img_mask, _ = context_mask(img_a, self.mask_ratio)\n  49 | \n  50 |         # Mix 1: labeled + unlabeled\n  51 |         mix_img_1 = img_a * img_mask + unimg_a * (1 - img_mask)\n  52 |         mix_lab_1 = lab_a * img_mask + plab_a * (1 - img_mask)\n  53 | \n  54 |         # Mix 2: unlabeled + labeled\n  55 |         mix_img_2 = unimg_b * img_mask + img_b * (1 - img_mask)\n  56 |         mix_lab_2 = plab_b * img_mask + lab_b * (1 - img_mask)\n  57 | \n  58 |         mix_imgs = torch.cat((mix_img_1, mix_img_2), dim=0)\n  59 |         mix_labs = torch.cat((mix_lab_1, mix_lab_2), dim=0)\n  60 | \n  61 |         mix_logits = extract_logits(self.model(mix_imgs))\n  62 | \n  63 |         # Labeled voxels carry weight 1, pseudo-labeled voxels carry u_weight.\n  64 |         forward_weights = img_mask.float() + self.u_weight * (1 - img_mask.float())\n  65 |         backward_weights = (1 - img_mask.float()) + self.u_weight * img_mask.float()\n  66 |         weights = torch.cat([\n  67 |             forward_weights.unsqueeze(0).expand(sub_bs, -1, -1, -1),\n  68 |             backward_weights.unsqueeze(0).expand(sub_bs, -1, -1, -1),\n  69 |         ], dim=0)\n  70 |         loss_ce = compute_masked_ce_loss(mix_logits, mix_labs, weights)\n  71 |         loss_dice = self.dice_loss(mix_logits, mix_labs, mask=weights)\n  72 |         total_loss = (loss_ce + loss_dice) / 2.0\n  73 | \n  74 |         loss_dict = {\n  75 |             \"total\": float(total_loss.item()),\n  76 |             \"ce\": float(loss_ce.item()),\n  77 |             \"dice\": float(loss_dice.item())\n  78 |         }\n  79 |         return total_loss, loss_dict"}, "pick_train_step": {"path": "methods/pick.py", "abs_path": "/home/u001015/BHSD_SSL/methods/pick.py", "start_line": 53, "end_line": 166, "title": "PICKMethod.pretrain_step & selftrain_step (2-Phase CutMix + Lesion MIM + Aux)", "code": "  53 |     def pretrain_step(\n  54 |         self,\n  55 |         sampled_batch: Dict[str, Any],\n  56 |         iter_num: int,\n  57 |         mim_mask: Optional[torch.Tensor] = None\n  58 |     ) -> Tuple[torch.Tensor, Dict[str, float]]:\n  59 |         \"\"\"Optimization step for Giai đoạn 1: Pre-training (Labeled CutMix + Lesion-informed MIM + Aux).\"\"\"\n  60 |         volume_batch = sampled_batch['image'][:self.labeled_bs].to(self.device)\n  61 |         label_batch = sampled_batch['label'][:self.labeled_bs].to(self.device)\n  62 | \n  63 |         if mim_mask is None:\n  64 |             mim_mask = get_or_create_mim_mask(sampled_batch, volume_batch.shape[0], self.patch_size)\n  65 |         mim_mask = mim_mask[:self.labeled_bs].unsqueeze(1).to(device=self.device, dtype=torch.float32)\n  66 | \n  67 |         img_a, img_b = volume_batch, torch.flip(volume_batch, dims=[0])\n  68 |         lab_a, lab_b = label_batch, torch.flip(label_batch, dims=[0])\n  69 | \n  70 |         with torch.no_grad():\n  71 |             img_mask, _ = context_mask( ch: Dict[str, Any],\n 112 |         iter_num: int,\n 113 |         mim_mask: Optional[torch.Tensor] = None\n 114 |     ) -> Tuple[torch.Tensor, Dict[str, float]]:\n 115 |         \"\"\"Optimization step for Giai đoạn 2: Self-training (Bidirectional CutMix + Unlabeled MIM + Aux).\"\"\"\n 116 |         batch = split_ssl_batch(sampled_batch, self.labeled_bs, device=self.device)\n 117 |         img_a, img_b = batch.img_a, batch.img_b\n 118 |         lab_a, lab_b = batch.lab_a, batch.lab_b\n 119 |         unimg = batch.unlabeled_volume\n 120 |         laimg = batch.labeled_volume\n 121 |         unimg_a, unimg_b = batch.unimg_a, batch.unimg_b\n 122 |         sub_bs = batch.sub_bs\n 123 | \n 124 |         raw_net = self.model.module if hasattr(self.model, 'module') else self.model\n 125 |         with torch.no_grad():\n 126 |             _, un_main_outputs, _ = raw_net(unimg)\n 127 |             un_prob = F.softmax(un_main_outputs, dim=1)\n 128 |             fg_un_prob = un_prob[:, 1:, :, :, :].sum(dim=1, keepdim=True)\n 129 |             un_ps_lab = (fg_un_prob > 0.5).float()\n 130 |             img_mask, _ = context_mask(img_a, self.mask_ratio)\n 131 | \n 132 |         cutmix_batch_f = img_a * img_mask + unimg_a * (1 - img_mask)\n 133 |         cutmix_batch_b = unimg_b * img_mask + img_b * (1 - img_mask)\n 134 | \n 135 |         # Forward CutMix through model\n 136 |         _, main_outputs, _ = self.model(torch.cat((cutmix_batch_f, cutmix_batch_b), dim=0))\n 137 |         out_f = main_outputs[:sub_bs]\n 138 |         out_b = main_outputs[sub_bs:]\n 139 | \n 140 |         # Masked supervised loss on labeled regions\n 141 |         loss_f = self.dice_ce_loss(out_f, lab_a, mask=img_mask.float())\n 142 |         loss_b = self.dice_ce_loss(out_b, lab_b, mask=(1.0 - img_mask).float())\n 143 |         loss_main = (loss_f + loss_b) / 2\n 144 | \n 145 |         mask_region = un_ps_lab\n 146 |         mim_batch = unimg * (1 - mask_region)\n 147 |         mim_outputs = self.model /**
 * Core Simulation, Symbolic Tensor Shape Propagator & Mathematical Engine
 * for the MedSSL-BHSD Research Method Visualization System.

 */

window.MedSSLCore = (function () {
  "use strict";

  // 1. Exact port of core/batching.py: resolve_batch_layout
  function resolveBatchLayout(batchSize, labeledBs, worldSize, method) {
    const ws = Math.max(1, parseInt(worldSize, 10) || 1);
    const bs = Math.max(1, parseInt(batchSize, 10) || 4);
    const lbsInput = Math.max(1, Math.min(bs, parseInt(labeledBs, 10) || 2));
    const labeled = method === "supervised" ? bs : lbsInput;
    const unlabeled = bs - labeled;

    const warnings = [];
    if (labeled % ws !== 0 || unlabeled % ws !== 0) {
      warnings.push(
        `[BatchLayout Error] Global batch (${labeled}L + ${unlabeled}U) không chia hết cho world_size=${ws} (core/batching.py:27).`
      );
    }
    const localL = Math.max(1, Math.floor(labeled / ws));
    const localU = method === "supervised" ? 0 : Math.max(1, Math.floor(unlabeled / ws));
    const localBs = localL + localU;

    if ((method === "pick" || method === "bcp") && (localL < 2 || localL % 2 !== 0 || localL !== localU)) {
      warnings.push(
        `[CutMix Pairing Warning] Phương pháp '${method}' yêu cầu local_labeled_bs == local_unlabeled_bs là số chẵn >= 2 trên mỗi GPU (hiện tại: ${localL}L + ${localU}U).`
      );
    }

    return {
      global_batch_size: bs,
      global_labeled_bs: labeled,
      global_unlabeled_bs: unlabeled,
      world_size: ws,
      local_batch_size: localBs,
      local_labeled_bs: localL,
      local_unlabeled_bs: localU,
      sub_bs: Math.max(1, Math.floor(localL / 2)),
      warnings: warnings,
    };
  }

  // 2. Exact port of losses/deep_supervision.py: compute_ds_weights & resolve_ds_weights
  function computeDsWeights(numScales, customWeights) {
    if (numScales <= 1) return [1.0];
    let raw = [];
    if (Array.isArray(customWeights) && customWeights.length >= numScales) {
      raw = customWeights.slice(0, numScales).map((x) => Math.max(0, Number(x) || 0));
    } else {
      for (let i = 0; i < numScales; i++) {
        raw.push(1.0 / Math.pow(2, i));
      }
    }
    const sum = raw.reduce((a, b) => a + b, 0) || 1.0;
    return raw.map((w) => w / sum);
  }

  // 3. Symbolic 3D Backbone Hierarchy & Tensor Shape Propagator
  function computeBackboneHierarchy(state, backboneSpecs) {
    const bbId = state.backbone || "nnunet3d";
    const spec = backboneSpecs[bbId] || backboneSpecs["nnunet3d"];
    const numStages = spec.supports_num_stages.includes(Number(state.num_stages))
      ? Number(state.num_stages)
      : spec.supports_num_stages[spec.supports_num_stages.length - 1];
    const aniso = spec.supports_anisotropic ? Boolean(state.anisotropic_kernels) : false;
    const dsEnabled = spec.supports_deep_supervision ? Boolean(state.deep_supervision) : false;

    const layout = resolveBatchLayout(state.batch_size, state.labeled_bs, state.world_size, state.method);
    const B = layout.local_batch_size;
    const B_L = layout.local_labeled_bs;
    const B_U = layout.local_unlabeled_bs;
    const C_in = 1;
    const numClasses = Number(state.num_classes) || 6;
    const Z0 = Number(state.patch_z) || 28;
    const Y0 = Number(state.patch_y) || 256;
    const X0 = Number(state.patch_x) || 256;

    const channels = spec.stage_rules.channels_by_stages[String(numStages)] || [32, 64, 128, 256, 320];
    const kernels = aniso ? spec.stage_rules.kernels_anisotropic : spec.stage_rules.kernels_isotropic;
    const strides = aniso ? spec.stage_rules.pool_strides_anisotropic : spec.stage_rules.pool_strides_isotropic;

    const encoderStages = [];
    let curZ = Z0,
      curY = Y0,
      curX = X0;
    const spatialWarnings = [];

    for (let s = 0; s < numStages; s++) {
      const isBottleneck = s === numStages - 1;
      const inCh = s === 0 ? C_in : channels[s - 1];
      const outCh = channels[s];
      const k = kernels[s] || [3, 3, 3];
      let poolStride = [1, 1, 1];
      if (s > 0) {
        poolStride = strides[s - 1] || [2, 2, 2];
        if (curZ % poolStride[0] !== 0 || curY % poolStride[1] !== 0 || curX % poolStride[2] !== 0) {
          spatialWarnings.push(
            `Stage ${s + 1} (${curZ}×${curY}×${curX}) không chia hết cho stride (${poolStride.join(",")}).`
          );
        }
        curZ = Math.max(1, Math.floor(curZ / poolStride[0]));
        curY = Math.max(1, Math.floor(curY / poolStride[1]));
        curX = Math.max(1, Math.floor(curX / poolStride[2]));
      }
      encoderStages.push({
        stage: s + 1,
        name: isBottleneck ? `bottleneck (Stage ${s + 1})` : `enc${s + 1}`,
        pool_name: s === 0 ? "Input Volume" : `pool${s} (stride ${poolStride.join("×")})`,
        stride_from_prev: poolStride,
        kernel: k,
        in_channels: inCh,
        out_channels: outCh,
        spatial: [curZ, curY, curX],
        tensor_shape: [B, outCh, curZ, curY, curX],
        is_anisotropic_kernel: k[0] === 1,
        is_z_preserved: s > 0 && poolStride[0] === 1,
        scale_factor_z: Math.round(Z0 / curZ),
        scale_factor_xy: Math.round(Y0 / curY),
      });
    }

    // Decoder stages (from numStages - 1 down to 1)
    const decoderStages = [];
    const auxOutputs = [];
    for (let s = numStages - 2; s >= 0; s--) {
      const encTarget = encoderStages[s];
      const prevDecOrBtn = s === numStages - 2 ? encoderStages[numStages - 1] : decoderStages[decoderStages.length - 1];
      const upStride = strides[s] || [2, 2, 2];
      const outCh = encTarget.out_channels;
      const concatCh = outCh * 2; // cat([up, skip])
      const z = encTarget.spatial[0];
      const y = encTarget.spatial[1];
      const x = encTarget.spatial[2];
      const hasAuxHead = dsEnabled && s >= 1; // d2..d6 have ds_conv2..ds_conv6; d1 has final_conv
      const headName = s === 0 ? "final_conv" : hasAuxHead ? `ds_conv${s + 1}` : null;

      const decObj = {
        stage: s + 1,
        name: `dec${s + 1}`,
        up_name: `up${s + 1} (stride ${upStride.join("×")})`,
        skip_from: `enc${s + 1}`,
        kernel: kernels[s] || [3, 3, 3],
        up_in_channels: prevDecOrBtn.out_channels,
        skip_channels: outCh,
        concat_channels: concatCh,
        out_channels: outCh,
        spatial: [z, y, x],
        tensor_shape: [B, outCh, z, y, x],
        head_name: headName,
        head_shape: headName ? [B, numClasses, z, y, x] : null,
        scale_label: `1/${Math.round(Y0 / y)} XY, 1/${Math.round(Z0 / z)} Z`,
      };
      decoderStages.push(decObj);
    }

    // Order aux outputs to match models/backbones/nnunet3d.py lines 258-266:
    // aux = [ds_conv2(d2), ds_conv3(d3), ds_conv4(d4), ds_conv5(d5), ds_conv6(d6)]
    if (dsEnabled) {
      for (let s = 1; s < numStages - 1; s++) {
        const decMatch = decoderStages.find((d) => d.stage === s + 1);
        if (decMatch && decMatch.head_shape) {
          auxOutputs.push({
            index: s - 1,
            name: decMatch.head_name,
            from_decoder: decMatch.name,
            raw_shape: decMatch.head_shape,
            labeled_slice_shape: [B_L, numClasses, decMatch.spatial[0], decMatch.spatial[1], decMatch.spatial[2]],
            upsampled_labeled_shape: [B_L, numClasses, Z0, Y0, X0],
            scale_xy: 1.0 / Math.round(Y0 / decMatch.spatial[1]),
          });
        }
      }
    }

    const totalScales = 1 + auxOutputs.length;
    const dsWeights = computeDsWeights(totalScales);

    // Map node shape keys for instant inspection
    const nodeShapes = {
      batch_input: [
        { name: "volume_batch (Local GPU)", shape: [B, 1, Z0, Y0, X0], dtype: "float32", note: `${B_L} Labeled + ${B_U} Unlabeled` },
        { name: "label_batch (Local GPU)", shape: [B, Z0, Y0, X0], dtype: "int64", note: `[0..${B_L - 1}] GT ∈ {0..${numClasses - 1}}, [${B_L}..${B - 1}] ≡ 0` },
      ],
      student_input: [
        { name: "scale (Intensity)", shape: [B, 1, 1, 1, 1], dtype: "float32", note: `U(${(1 - state.student_intensity_scale).toFixed(2)}, ${(1 + state.student_intensity_scale).toFixed(2)})` },
        { name: "noise (Gaussian)", shape: [B, 1, Z0, Y0, X0], dtype: "float32", note: `N(0, ${state.student_noise_std}²)` },
        { name: "student_input", shape: [B, 1, Z0, Y0, X0], dtype: "float32", note: state.perturb_student ? "Perturbed Volume" : "Unperturbed (perturb_student=False)" },
      ],
      student_outputs: [
        { name: "student_logits (main 'seg')", shape: [B, numClasses, Z0, Y0, X0], dtype: "float16 (AMP)", note: `weight w̃_0 = ${dsWeights[0].toFixed(4)}` },
        ...auxOutputs.map((a, idx) => ({
          name: `student_aux[${idx}] (${a.name})`,
          shape: a.raw_shape,
          dtype: "float16 (AMP)",
          note: `weight w̃_${idx + 1} = ${dsWeights[idx + 1].toFixed(4)}`,
        })),
      ],
      teacher_outputs: [
        { name: "teacher_logits (no_grad)", shape: [B, numClasses, Z0, Y0, X0], dtype: "float16 (AMP)", note: "eval() mode on clean volume_batch" },
        {
          name: "teacher_aux",
          shape: dsEnabled && state.consistency_multiscale ? `${auxOutputs.length} aux tensors` : "[] (Empty List)",
          dtype: "no_grad",
          note: state.consistency_multiscale ? "return_all_scales=True" : "Skipped (consistency_multiscale=False)",
        },
      ],
      sup_loss_tensors: [
        { name: "lab_logits", shape: [B_L, numClasses, Z0, Y0, X0], dtype: "float16", note: `Sliced [:labeled_bs=${B_L}]` },
        { name: "lab_targets", shape: [B_L, Z0, Y0, X0], dtype: "int64", note: `Ground truth labels` },
        ...(dsEnabled
          ? [
              {
                name: "aux_lab (Trilinear Upsampled)",
                shape: [B_L, numClasses, Z0, Y0, X0],
                dtype: "float16",
                note: `F.interpolate(${auxOutputs.length} scales -> ${Z0}×${Y0}×${X0})`,
              },
            ]
          : []),
      ],
      cons_loss_tensors: [
        { name: "student_prob", shape: [B, numClasses, Z0, Y0, X0], dtype: "float32", note: "F.softmax(student_logits.float(), dim=1)" },
        { name: "teacher_prob", shape: [B, numClasses, Z0, Y0, X0], dtype: "float32", note: "F.softmax(teacher_logits.float(), dim=1)" },
        { name: "fg_s & fg_t (Soft Dice)", shape: [B, Math.max(1, numClasses - 1), Z0, Y0, X0], dtype: "float32", note: "Foreground channels [:, 1:] (Excludes BG)" },
        { name: "mse_per_class", shape: [numClasses], dtype: "float32", note: `Weighted by [${state.bg_consistency_weight}, 1, 1, 1, 1, 1]` },
      ],
      optimizer_state: [
        { name: "total_loss", shape: [1], dtype: "float32 (scalar)", note: "L_sup + w_cons(t) * L_cons" },
        { name: "Student param.grad", shape: "All θ_student", dtype: "float32 (unscaled)", note: "clip_grad_norm_(max_norm=12.0)" },
      ],
      validation_state: [
        { name: "Gaussian 3D Weight Map", shape: [Z0, Y0, X0], dtype: "float32", note: "sigma_scale = 1/8, center = 1.0" },
        { name: "Sliding Window Score Map", shape: [numClasses, "W_Z", "W_Y", "W_X"], dtype: "float32", note: "Accumulated over overlapping patches (stride Z=8, XY=32)" },
      ],
      pseudo_labels: [
        { name: "pl1, pl2 (Argmax Targets)", shape: [B, Z0, Y0, X0], dtype: "int64", note: "Discrete class indices {0..5} (stop-gradient)" },
      ],
    };

    const labelnum = Math.max(1, parseInt(state.labelnum, 10) || 154);
    const epochLen = Math.max(1, Math.floor(Math.floor(labelnum / layout.world_size) / layout.local_labeled_bs));

    return {
      backboneSpec: spec,
      numStages,
      aniso,
      dsEnabled,
      layout,
      epochLen,
      encoderStages,
      decoderStages,
      auxOutputs,
      dsWeights,
      nodeShapes,
      spatialWarnings,
      zDownsampleTotal: Math.round(Z0 / encoderStages[encoderStages.length - 1].spatial[0]),
      xyDownsampleTotal: Math.round(Y0 / encoderStages[encoderStages.length - 1].spatial[1]),
    };
  }

  // 4. Exact port of Schedule Evaluators (LR, Rampup, Rampdown, EMA Alpha)
  function sigmoidRampup(current, rampupLength) {
    if (rampupLength <= 0) return 1.0;
    const c = Math.max(0.0, Math.min(current, rampupLength));
    const phase = 1.0 - c / rampupLength;
    return Math.exp(-5.0 * phase * phase);
  }

  function evaluateSchedulesAtStep(iterNum, state, epochLen) {
    const maxIter = Math.max(1, Number(state.max_iteration) || 12000);
    const t = Math.max(0, Math.min(iterNum, maxIter));
    const curEpoch = t / Math.max(1, epochLen);

    // 4.1 Learning Rate (core/optimizers.py:64-96)
    const baseLr = Number(state.base_lr) || 0.01;
    const polyPower = Number(state.poly_power) || 0.7;
    const warmupIters = Math.max(0, parseInt(state.warmup_iters, 10) || 0);
    const schedType = (state.lr_scheduler || "poly").toLowerCase();
    const minLr = 1e-6;
    let lr = baseLr;
    if (warmupIters > 0 && t < warmupIters) {
      lr = Math.max(baseLr * (t / Math.max(1, warmupIters)), minLr);
    } else {
      const effIter = t - warmupIters;
      const effMax = Math.max(1, maxIter - warmupIters);
      if (schedType === "cosine" || schedType === "cosine_annealing") {
        const prog = Math.min(Math.max(effIter / effMax, 0.0), 1.0);
        lr = Math.max(baseLr * 0.5 * (1.0 + Math.cos(Math.PI * prog)), minLr);
      } else if (schedType === "constant") {
        lr = baseLr;
      } else {
        const decay = Math.pow(Math.max(1.0 - effIter / effMax, 0.0), polyPower);
        lr = Math.max(baseLr * decay, minLr);
      }
    }

    // 4.2 Consistency Weight (methods/mean_teacher.py:94-110)
    const consMax = Number(state.consistency) ?? 0.05;
    const rampup = Number(state.consistency_rampup) ?? 4000.0;
    const rampdownStart = Number(state.consistency_rampdown_start) ?? 7800;
    const minFactor = Number(state.consistency_min_factor) ?? 0.25;

    let baseW = consMax;
    let rampupUnit = "disabled";
    let rampupFactor = 1.0;
    if (rampup <= 0) {
      baseW = consMax;
      rampupFactor = 1.0;
    } else if (rampup > 100) {
      rampupUnit = "iterations (rampup > 100)";
      rampupFactor = sigmoidRampup(t, rampup);
      baseW = consMax * rampupFactor;
    } else {
      rampupUnit = `epochs (rampup <= 100, 1 ep = ${epochLen} iters)`;
      rampupFactor = sigmoidRampup(curEpoch, rampup);
      baseW = consMax * rampupFactor;
    }

    let decayFactor = 1.0;
    let consW = baseW;
    const inRampdown = rampdownStart > 0 && t > rampdownStart;
    if (inRampdown) {
      const progress = Math.min(Math.max((t - rampdownStart) / Math.max(maxIter - rampdownStart, 1), 0.0), 1.0);
      decayFactor = minFactor + (1.0 - minFactor) * 0.5 * (1.0 + Math.cos(Math.PI * progress));
      consW = baseW * decayFactor;
    }

    // 4.3 EMA Alpha (methods/ssl_utils.py:93-114)
    const targetAlpha = Number(state.ema_decay) || 0.999;
    const emaSched = (state.ema_schedule || "cosine").toLowerCase();
    let actualAlpha = targetAlpha;
    if (emaSched === "cosine" && maxIter > 0) {
      const minAlpha = 0.99;
      const progress = Math.min(Math.max(t / maxIter, 0.0), 1.0);
      actualAlpha = minAlpha + (targetAlpha - minAlpha) * 0.5 * (1.0 - Math.cos(Math.PI * progress));
    } else {
      actualAlpha = Math.min(1.0 - 1.0 / (t + 1), targetAlpha);
    }
    const studentUpdateRate = 1.0 - actualAlpha;
    const effectiveMemorySteps = 1.0 / Math.max(1e-6, 1.0 - actualAlpha);

    return {
      iter: t,
      epoch: curEpoch,
      lr,
      consW,
      rampupFactor,
      decayFactor,
      rampupUnit,
      inRampdown,
      actualAlpha,
      studentUpdateRate,
      effectiveMemorySteps,
    };
  }

  function generateScheduleSeries(state, epochLen, numPoints = 120) {
    const maxIter = Math.max(100, Number(state.max_iteration) || 12000);
    const points = [];
    for (let i = 0; i <= numPoints; i++) {
      const iter = Math.round((i / numPoints) * maxIter);
      points.push(evaluateSchedulesAtStep(iter, state, epochLen));
    }

    // Detect smart implementation diagnostics
    const alerts = [];
    const rampup = Number(state.consistency_rampup) ?? 4000;
    if (rampup > 0 && rampup <= 100) {
      alerts.push({
        level: "warning",
        code: "methods/mean_teacher.py:98-101",
        title: "Chế độ Ramp-up theo Epoch đang kích hoạt (consistency_rampup <= 100)",
        message: `Vì consistency_rampup = ${rampup} <= 100, hàm get_current_consistency_weight() truyền cur_epoch thay vì iter_num vào sigmoid_rampup(). Với epoch_len = ${epochLen} steps/epoch, quá trình ramp-up hoàn tất ở bước ${Math.round(rampup * epochLen)}!`,
      });
    } else if (rampup > 100) {
      alerts.push({
        level: "info",
        code: "methods/mean_teacher.py:98-99",
        title: "Chế độ Ramp-up theo Iteration đang kích hoạt (consistency_rampup > 100)",
        message: `Vì consistency_rampup = ${rampup} > 100, hàm truyền trực tiếp iter_num vào sigmoid_rampup(iter_num, ${rampup}). Đạt đỉnh w_cons = ${state.consistency} tại đúng iteration ${rampup}.`,
      });
    }

    if (state.ema_schedule === "cosine" && Math.abs(Number(state.ema_decay) - 0.99) < 1e-6) {
      alerts.push({
        level: "warning",
        code: "methods/ssl_utils.py:107-109",
        title: "Đường cong Cosine EMA bị suy biến thành hằng số α_t ≡ 0.99",
        message:
          "Trong update_ema_variables(), min_alpha được gán cứng bằng 0.99. Khi ema_decay = 0.99 (như trong preset bhsd_mt_nnunet_fold0.yaml), biểu thức (alpha - min_alpha) = 0 khiến α_t giữ nguyên ở 0.99 suốt quá trình train (cửa sổ nhớ cố định 100 bước).",
      });
    }

    if (Number(state.consistency) >= 0.5) {
      alerts.push({
        level: "caution",
        code: "methods/mean_teacher.py:177",
        title: "Trọng số Consistency cao (consistency >= 0.5)",
        message: `Với consistency = ${state.consistency}, thành phần unsupervised có thể lấn át supervised gradient ở các lớp hiếm (EDH, SAH) nếu Teacher dự đoán xác suất thấp, dễ dẫn đến confirmation bias.`,
      });
    }

    if (Number(state.confidence_thresh) > 0.0) {
      alerts.push({
        level: "info",
        code: "losses/consistency.py:72-76",
        title: "Chế độ CT Foreground-Preserving Confidence Mask đang bật",
        message: `Khi confidence_thresh = ${state.confidence_thresh} > 0, code áp dụng điều kiện kép: giữ lại voxel nếu (max_fg_prob >= min(${state.confidence_thresh}, 0.4)) HOẶC (bg_prob >= ${state.confidence_thresh}) để bảo vệ các tổn thương có độ tự tin trung bình.`,
      });
    }

    return { points, alerts };
  }

  // 5. Interactive Voxel-Level Consistency Loss & BHSD Metric Paradox Simulator
  function simulateConsistencyLoss(state, simParams) {
    // Simulated 6-class voxel distributions across a 3D CT patch (BG=97.5% voxels, 5 hemorrhage classes=2.5%)
    const bgWeight = Number(state.bg_consistency_weight) ?? 0.05;
    const confThresh = Number(state.confidence_thresh) ?? 0.0;
    const consType = (state.consistency_type || "hybrid").toLowerCase();

    // Class names and simulated per-class Student vs Teacher probability discrepancy & Dice overlap
    const gapScale = Number(simParams.pred_discrepancy) || 0.18;
    const fgOverlap = Number(simParams.fg_overlap) || 0.72;

    const classes = [
      { idx: 0, name: "Background (Class 0)", voxel_share: 0.975, weight: bgWeight, raw_mse: 0.042 * gapScale * 5, soft_dice: 0.985 },
      { idx: 1, name: "Epidural - EDH (Class 1)", voxel_share: 0.001, weight: 1.0, raw_mse: 0.065 * gapScale * 5, soft_dice: fgOverlap * 0.45 },
      { idx: 2, name: "Intraparenchymal - IPH (Class 2)", voxel_share: 0.009, weight: 1.0, raw_mse: 0.038 * gapScale * 5, soft_dice: Math.min(0.95, fgOverlap * 1.15) },
      { idx: 3, name: "Intraventricular - IVH (Class 3)", voxel_share: 0.005, weight: 1.0, raw_mse: 0.041 * gapScale * 5, soft_dice: Math.min(0.95, fgOverlap * 1.05) },
      { idx: 4, name: "Subarachnoid - SAH (Class 4)", voxel_share: 0.004, weight: 1.0, raw_mse: 0.058 * gapScale * 5, soft_dice: fgOverlap * 0.75 },
      { idx: 5, name: "Subdural - SDH (Class 5)", voxel_share: 0.006, weight: 1.0, raw_mse: 0.052 * gapScale * 5, soft_dice: fgOverlap * 0.85 },
    ];

    // Confidence mask retention calculation (losses/consistency.py:72-80)
    const fgEffThresh = confThresh > 0 ? Math.min(confThresh, 0.4) : 0.0;
    const bgRetainedPct = confThresh > 0 ? Math.max(15, Math.round((1.0 - Math.pow(confThresh, 2.2) * 0.45) * 100)) : 100;
    const fgRetainedPct = confThresh > 0 ? Math.max(10, Math.round((1.0 - fgEffThresh * 0.65) * 100)) : 100;
    const naiveFgRetainedPct = confThresh > 0 ? Math.max(2, Math.round((1.0 - Math.pow(confThresh, 1.1) * 0.92) * 100)) : 100;

    const totalWeight = classes.reduce((s, c) => s + c.weight, 0);
    const weightedMse = classes.reduce((s, c) => s + c.weight * c.raw_mse, 0) / (totalWeight + 1e-6);
    const unweightedMse = classes.reduce((s, c) => s + c.raw_mse, 0) / classes.length;

    const fgClasses = classes.slice(1);
    const meanFgDiceScore = fgClasses.reduce((s, c) => s + c.soft_dice, 0) / fgClasses.length;
    const softDiceLoss = 1.0 - meanFgDiceScore;
    const klLoss = weightedMse * 2.35;

    let activeConsLoss = 0.5 * weightedMse + 0.5 * softDiceLoss;
    if (consType === "dice") activeConsLoss = softDiceLoss;
    else if (consType === "weighted_mse" || consType === "mse") activeConsLoss = weightedMse;
    else if (consType === "kl") activeConsLoss = klLoss;
    else if (consType === "raw_mse") activeConsLoss = unweightedMse;

    // Gradient share per class in MSE term
    classes.forEach((c) => {
      c.weighted_mse_share_pct = ((c.weight * c.raw_mse) / ( weightedMse * totalWeight + 1e-9)) * 100;
    });

    return {
      classes,
      weightedMse,
      unweightedMse,
      meanFgDiceScore,
      softDiceLoss,
      klLoss,
      activeConsLoss,
      fgEffThresh,
      bgRetainedPct,
      fgRetainedPct,
      naiveFgRetainedPct,
    };
  }

  // 6. BHSD 38-Case Fold 0 Validation Metric Paradox Simulator
  function simulateMetricParadox(paradoxParams) {
    // Ground-truth Fold 0 Validation Cohort (38 cases total)
    const cohort = [
      { id: "EDH", name: "Epidural (EDH)", pos: 6, neg: 32 },
      { id: "IPH", name: "Intraparenchymal (IPH)", pos: 23, neg: 15 },
      { id: "IVH", name: "Intraventricular (IVH)", pos: 22, neg: 16 },
      { id: "SAH", name: "Subarachnoid (SAH)", pos: 20, neg: 18 },
      { id: "SDH", name: "Subdural (SDH)", pos: 13, neg: 25 },
    ];
    const totalCases = 38;
    const posDiceMultiplier = Number(paradoxParams.pos_dice_level) ?? 1.0; // 0.0 (empty model) to 1.5
    const fpRateScale = Number(paradoxParams.fp_case_rate) ?? 1.0; // 0.0 (no FP on neg cases) to 1.5

    // Reference values at iter 8,400 of run o6s4pex3
    const refPosDice = { EDH: 0.0, IPH: 0.5395, IVH: 0.4872, SAH: 0.2559, SDH: 0.3453 };
    const refFpNegCases = { EDH: 0, IPH: 13, IVH: 14, SAH: 18, SDH: 25 };

    const results = cohort.map((c) => {
      const basePosD = refPosDice[c.id];
      const simPosDice = Math.min(0.95, Math.max(0.0, basePosD * posDiceMultiplier));
      const fpNegCount = Math.min(c.neg, Math.max(0, Math.round(refFpNegCases[c.id] * fpRateScale)));
      const tnNegCount = c.neg - fpNegCount; // True negative cases get Dice = 1.0 in legacy metric!
      // Legacy case-mean Dice = (sum of pos case Dice + 1.0 * tnNegCount + 0.0 * fpNegCount) / 38
      const legacyCaseMean = (c.pos * simPosDice + tnNegCount * 1.0) / totalCases;
      const emptyModelLegacy = c.neg / totalCases;
      return {
        ...c,
        simPosDice,
        fpNegCount,
        tnNegCount,
        legacyCaseMean,
        emptyModelLegacy,
      };
    });

    const legacyMdice = results.reduce((s, r) => s + r.legacyCaseMean, 0) / results.length;
    const positiveMacro = results.reduce((s, r) => s + r.simPosDice, 0) / results.length;
    const emptyBaselineMdice = results.reduce((s, r) => s + r.emptyModelLegacy, 0) / results.length; // 0.55789

    return {
      results,
      legacyMdice,
      positiveMacro,
      emptyBaselineMdice,
    };
  }

  return {
    resolveBatchLayout,
    computeDsWeights,
    computeBackboneHierarchy,
    sigmoidRampup,
    evaluateSchedulesAtStep,
    generateScheduleSeries,
    simulateConsistencyLoss,
    simulateMetricParadox,
  };
})();

              id="global-iter-slider"
              type="range"
              min="0"
              max="${state.max_iteration}"
              step="50"
              value="${state.iter_num}"

            />

          <div class="lg:col-span-7 grid grid-cols-2 sm:grid-cols-4 gap-2">
            <div class="bg-[var(--background)] border border-[var(--border)] rounded-lg px-2.5 py-1.5">
              <div class="text-xs text-[var(--muted-foreground)]">Per-Rank Batch (${state.world_size} GPU)</div>
              <div class="text-xs font-bold text-[var(--foreground)] mt-0.5">
                ${hierarchy.layout.local_batch_size} = <span class="text-emerald-400">${hierarchy.layout.local_labeled_bs}L</span> + <span class="text-amber-400">${hierarchy.layout.local_unlabeled_bs}U</span>
                <span class="text-[var(--muted-foreground)] font-normal">(${state.patch_z}×${state.patch_y}×${state.patch_x})</span>

            <div class="bg-[var(--background)] border border-[var(--border)] rounded-lg px-2.5 py-1.5">
              <div class="text-xs text-[var(--muted-foreground)]">Learning Rate <code>lr(t)</code></div>
              <div class="text-xs font-bold text-blue-400 mt-0.5">
                ${stepMetrics.lr.toFixed(6)} <span class="text-[var(--muted-foreground)] font-normal">(${state.lr_scheduler}^${state.poly_power})</span>
              </div>
            </div>

            <div class="bg-[var(--background)] border border-[var(--border)] rounded-lg px-2.5 py-1.5">
              <div class="text-xs text-[var(--muted-foreground)]">Consistency <code>w_cons(t)</code></div>
              <div class="text-xs font-bold text-amber-400 mt-0.5">

            <div class="bg-[var(--background)] border border-[var(--border)] rounded-lg px-2.5 py-1.5">
              <div class="text-xs text-[var(--muted-foreground)]">EMA <code>α_t</code> & Memory</div>
              <div class="text-xs font-bold text-purple-400 mt-0.5">
                ${stepMetrics.actualAlpha.toFixed(5)} <span class="text-[var(--muted-foreground)] font-normal">(~${Math.round(stepMetrics.effectiveMemorySteps)} steps)</span>
              </div>

        </div>

        <!-- Navigation Tabs -->
        <div class="flex flex-wrap gap-1.5 mt-3 pt-3 border-t border-[var(--border)]">
          ${tabs
            .map((t) => {
              const active = state.activeView === t.id;
              return `
                <button
                  data-view-tab="${t.id}"
                  class="px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 ${
                    active

                  }"
                >
                  <span>${escapeHtml(t.label)}</span>
                  <span class="px-1.5 py-0.2 rounded text-xs ${
                    active ? "bg-blue-800 text-blue-100" : "bg-[var(--card)] text-[var(--muted-foreground)]"

        </div>
      </header>
