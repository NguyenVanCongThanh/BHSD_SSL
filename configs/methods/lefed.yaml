# LeFeD Configuration for BHSD Multi-class 3D Segmentation
experiment:
  name: "BHSD_lefed_5folds"
  task: "multiclass"
  num_classes: 6
  fold: 0

model:
  name: "lefed_net"
  in_channels: 1
  has_dropout: true
  normalization: "groupnorm"

method:
  name: "lefed"
  max_iteration: 12000
  base_lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  consistency: 1.0
  consistency_rampup: 40.0
  feedback_steps: 3
  feedback_scale: 0.001
  bg_consistency_weight: 0.1
  ds_weights: [0.8, 0.6, 0.4, 0.2, 0.1]

data:
  batch_size: 4
  labeled_bs: 2
  patch_size: [32, 160, 160]

logging:
  val_interval: 500
  save_interval: 50
  val_stride_xy: 32
  val_stride_z: 8
  use_wandb: false
