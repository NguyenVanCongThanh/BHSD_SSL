# Mean Teacher Configuration for BHSD
experiment:
  name: "BHSD_mean_teacher_5folds"
  task: "multiclass"
  num_classes: 6

model:
  name: "vnet_single"
  in_channels: 1

method:
  name: "mean_teacher"
  max_iteration: 12000
  base_lr: 0.01
  consistency: 1.0
  consistency_rampup: 40.0
  ema_decay: 0.99

logging:
  val_interval: 500
