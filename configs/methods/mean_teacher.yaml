# Enhanced Mean Teacher Configuration for BHSD Multi-class 3D Segmentation
experiment:
  name: "BHSD_mean_teacher_5folds"
  task: "multiclass"
  num_classes: 6
  fold: 0
  amp: true                           # Mixed precision (FP16) training with GradScaler

model:
  name: "nnunet3d"                    # 5-stage nnU-Net 3D with InstanceNorm & LeakyReLU
  in_channels: 1
  base_filters: 32
  has_dropout: false

method:
  name: "mean_teacher"
  max_iteration: 12000
  base_lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  lr_scheduler: "poly"                # Polynomial decay: lr = base_lr * (1 - iter/max_iter)^power
  poly_power: 0.9                     # Standard nnU-Net power factor
  ema_decay: 0.99
  consistency: 1.0
  consistency_rampup: 40.0
  consistency_type: "weighted_mse"    # Options: weighted_mse, dice, kl, mse
  bg_consistency_weight: 0.1          # Downweight background (class 0) to mitigate voxel imbalance
  confidence_thresh: 0.85             # Only enforce consistency on confident teacher predictions

data:
  batch_size: 4
  labeled_bs: 2
  labelnum: 154
  patch_size: [32, 160, 160]

logging:
  val_interval: 200
  save_interval: 50
  val_stride_xy: 32
  val_stride_z: 8
  use_wandb: false
  val_visualize: true
  num_vis_samples: 4
