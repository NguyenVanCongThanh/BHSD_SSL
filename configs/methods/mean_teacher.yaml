# Enhanced Mean Teacher Configuration for BHSD Multi-class 3D Segmentation
experiment:
  name: "BHSD_mean_teacher_5folds"
  task: "multiclass"
  num_classes: 6
  fold: 0
  amp: true                           # Mixed precision (FP16) training with GradScaler

model:
  name: "nnunet3d"                    # 6-stage nnU-Net 3D with InstanceNorm & LeakyReLU
  in_channels: 1
  base_filters: 32
  num_stages: 6                       # 6 stages (deep semantic bottleneck 2x6x6, 32x downsampled)
  has_dropout: false
  deep_supervision: true              # Multi-scale auxiliary heads on intermediate decoder layers

method:
  name: "mean_teacher"
  max_iteration: 12000
  base_lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  lr_scheduler: "poly"                # Polynomial decay: lr = base_lr * (1 - iter/max_iter)^power
  poly_power: 0.7                     # Slower decay power factor (0.7) to sustain supervised gradients in late phase
  ema_decay: 0.999                    # Target EMA decay
  ema_schedule: "cosine"              # Cosine rampup of alpha (0.99 -> 0.999) to keep teacher agile early and stable late
  consistency: 0.15                   # Balanced consistency weight so supervised signals lead throughout
  consistency_rampup: 2000.0          # Smooth step-based rampup over first 2000 iters
  consistency_rampdown_start: 7800    # Begin smooth cosine rampdown after iter 7800 to prevent IVH pseudo-label drift
  consistency_min_factor: 0.25        # Rampdown floor (0.15 * 0.25 = ~0.0375) for late-stage supervised fine-tuning
  consistency_type: "hybrid"          # 50% Soft Dice on foreground lesions + 50% Class-balanced MSE
  bg_consistency_weight: 0.05         # Downweight background channel to prevent background dominance
  confidence_thresh: 0.75             # Strict threshold (>=0.75) to filter out uncertain teacher predictions
  perturb_student: true               # Asymmetric perturbation on student (Gaussian noise + intensity scaling)
  student_noise_std: 0.02             # Gentle Gaussian noise standard deviation
  student_intensity_scale: 0.05       # Subtle intensity scaling (+-5%)
  deep_supervision:
    weights: [0.516, 0.258, 0.129, 0.065, 0.032] # Normalized exponential decay weights for 5 scales
    consistency_multiscale: true          # Apply consistency alignment to intermediate decoder heads

data:
  batch_size: 6                       # 2 labeled + 4 unlabeled (triples unlabeled SSL exposure)
  labeled_bs: 2
  labelnum: 154
  patch_size: [32, 192, 192]          # +44% spatial context, full brain coverage on axial plane

logging:
  val_interval: 200
  save_interval: 50
  val_stride_xy: 32
  val_stride_z: 8
  use_wandb: false
  val_visualize: true
  num_vis_samples: 4
