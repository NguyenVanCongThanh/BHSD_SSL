# Enhanced Mean Teacher Configuration for BHSD Multi-class 3D Segmentation
experiment:
  name: "BHSD_mean_teacher_5folds"
  task: "multiclass"
  num_classes: 6
  fold: 0
  amp: true                           # Mixed precision (FP16) training with GradScaler

model:
  name: "nnunet3d"                    # 7-stage nnU-Net 3D with InstanceNorm & LeakyReLU (matches nnUNet v2 Option 1 & Spacing 0.5)
  in_channels: 1
  base_filters: 32
  num_stages: 7                       # 7 stages (320-ch bottleneck 4x3x3, 64x spatial downsampled)
  has_dropout: false
  deep_supervision: true              # Multi-scale auxiliary heads on intermediate decoder layers (5 scales)
  anisotropic_kernels: true           # (1, 3, 3) in enc1 & enc2 to match nnU-Net v2 and prevent Z slice blurring
  use_strided_conv: true              # Learnable strided conv downsampling instead of static MaxPool3d

method:
  name: "mean_teacher"
  max_iteration: 30000
  base_lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  lr_scheduler: "poly"                # Polynomial decay: lr = base_lr * (1 - iter/max_iter)^power
  poly_power: 0.7                     # Slower decay power factor (0.7) to sustain supervised gradients in late phase
  ema_decay: 0.999                    # Target EMA decay
  ema_schedule: "cosine"              # Cosine rampup of alpha (0.99 -> 0.999) to keep teacher agile early and stable late
  consistency: 0.05                   # Lowered consistency weight (0.05) so supervised signals dominate throughout
  consistency_rampup: 8000.0          # Gentle step-based rampup over first 8000 iters to prevent early collapse
  consistency_rampdown_start: 19500   # Begin smooth cosine rampdown after iter 19500 to prevent IVH pseudo-label drift
  consistency_min_factor: 0.25        # Rampdown floor (0.05 * 0.25 = ~0.0125) for late-stage supervised fine-tuning
  consistency_type: "hybrid"          # 50% Soft Dice on foreground lesions + 50% Class-balanced MSE
  bg_consistency_weight: 0.05         # Downweight background channel to prevent background dominance
  confidence_thresh: 0.0              # Disabled (0.0) to eliminate background trapping on thin/small lesions (IVH, SDH)
  perturb_student: true               # Asymmetric perturbation on student (Gaussian noise + intensity scaling)
  student_noise_std: 0.02             # Gentle Gaussian noise standard deviation
  student_intensity_scale: 0.05       # Subtle intensity scaling (+-5%)
  deep_supervision:
    weights: [0.516, 0.258, 0.129, 0.065, 0.032] # Normalized exponential decay weights for 5 aux scales (stages 2-6)
    consistency_multiscale: false         # Disabled on intermediate aux heads to avoid blurry lesion collapse

data:
  batch_size: 4                       # Global: 2 labeled + 2 unlabeled (DDP 2 GPU: 1 lab + 1 unlab/GPU)
  labeled_bs: 2
  labelnum: 154
  patch_size: [32, 192, 192]          # +44% spatial context, full brain coverage on axial plane

logging:
  val_interval: 250
  save_interval: 50
  val_stride_xy: 32
  val_stride_z: 8
  use_wandb: false
  val_visualize: true
  num_vis_samples: 4
