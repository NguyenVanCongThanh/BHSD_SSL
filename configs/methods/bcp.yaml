# Bidirectional Copy-Paste (BCP) Configuration for BHSD (CVPR 2023 Standard)
experiment:
  name: "BHSD_bcp_5folds"
  task: "multiclass"
  num_classes: 6
  phase: "all"             # "all", "pre_train", or "self_train"

model:
  name: "vnet"
  in_channels: 1

method:
  name: "bcp"
  base_lr: 0.01
  momentum: 0.99
  weight_decay: 0.00003
  mask_ratio: 0.666667     # 2/3 context mask ratio
  u_weight: 0.5            # Loss weighting for pseudo-labeled voxels
  ema_decay: 0.99          # EMA decay rate for Teacher
  pre_max_iteration: 2000  # Stage 1: Pre-training iterations on labeled CutMix
  self_max_iteration: 10000 # Stage 2: Self-training iterations with Bidirectional CutMix

logging:
  val_interval: 500
  save_interval: 50
