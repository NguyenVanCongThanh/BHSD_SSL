# Base Configuration for MedSSL-BHSD Framework
experiment:
  name: "BHSD_multiclass_PICK_5folds"
  task: "multiclass"        # "multiclass" (6 classes: 0..5) or "binary" (0 vs 1)
  num_classes: 6            # 6 for multiclass, 2 for binary
  fold: 0                   # 0..4 for 5-fold cross-validation
  seed: 1337
  deterministic: true
  exp_dir: "/home/u001015/experiments"
  resume: false
  phase: "all"              # "all", "pre_train", or "self_train"

data:
  root_path: "/home/u001015/notebook/preprocessed_bhsd_pick/"
  patch_size: [32, 160, 160]
  batch_size: 4             # Global batch across all GPUs; DDP divides per rank
  labeled_bs: 2             # Global labeled count; remaining samples are unlabeled
  labelnum: 15              # Number of labeled samples (e.g. 15 for ~10% or 30 for ~20%)
  max_samples: 2200         # Upper bound of sample pool

model:
  name: "vnet"              # "vnet", "unet3d", "unetr", "vnet_single"
  in_channels: 1
  normalization: "batchnorm"
  has_dropout: true

method:
  name: "pick"              # "pick", "supervised", "mean_teacher", "cps", "bcp"
  base_lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001

logging:
  use_wandb: false          # Toggle Weights & Biases experiment tracking
  save_wandb_model: true    # Auto-upload checkpoints (.pth) to W&B Cloud Artifacts
  wandb_project: "PICK_BHSD"
  wandb_entity: null        # W&B team/username (leave null for default account)
  wandb_run_name: null      # Custom run name (defaults to {exp_name}_{method}_fold{fold})
  wandb_id: null            # Specific Run ID to attach to (optional, defaults to auto-resolved)
  val_interval: 500
  val_stride_xy: 32
  val_stride_z: 8
  wandb_mode: "online"     # online | offline | disabled; WANDB_MODE env overrides
  wandb_required: false    # Fail rather than degrade on initialization/log failures
  artifact_interval: null  # Defaults to val_interval; checked at local saves/validation, plus phase end
  log_interval: 10
  val_amp: true
  val_gaussian: true
  val_surface_metrics: false
  val_tta: false
  val_visualize: true
  num_vis_samples: 4
  visual_every_n_validations: 1
  visualization:
    case_ids: []           # Explicit fixed cohort, including rare classes/negative cases
    slice_indices: {}     # Optional case ID -> fixed axial Z; otherwise GT-max or centre
    target_shape: [512, 512]
    intensity_mode: "percentile"  # hu requires declared HU or verified zscore_hu metadata
    percentiles: [1.0, 99.0]      # Fixed volume-wide range; never per-prediction
    window_center: 40.0
    window_width: 80.0
    alpha: 0.5
    interactive: false    # Optional dual mask view in addition to deterministic RGB panels
