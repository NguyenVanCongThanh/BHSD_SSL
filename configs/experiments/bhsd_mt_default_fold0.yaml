# Experiment Preset: BHSD Multi-Class Mean Teacher Baseline Setting (Fold 0)
# Setting default: patch_size [32, 160, 160], batch_size 4, labeled_bs 2
experiment:
  name: "bhsd_mt_default_fold0"
  task: "multiclass"
  num_classes: 6
  fold: 0
  seed: 1337
  deterministic: true
  phase: "all"

dataset: "bhsd_multiclass"

model:
  name: "vnet"
  in_channels: 1
  normalization: "batchnorm"
  has_dropout: true

method:
  name: "mean_teacher"
  base_lr: 0.01
  max_iteration: 15000
  ema_decay: 0.99
  consistency: 1.0
  consistency_rampup: 40.0

data:
  patch_size: [32, 160, 160]
  batch_size: 4
  labeled_bs: 2
  labelnum: 15

logging:
  val_step_size: 0.5

