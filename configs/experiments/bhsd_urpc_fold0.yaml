# Experiment Preset: BHSD Multi-Class URPC (Fold 0, MedIA 2022)
experiment:
  name: "bhsd_urpc_fold0"
  task: "multiclass"
  num_classes: 6
  fold: 0
  seed: 1337
  deterministic: true

dataset: "bhsd_multiclass"

model:
  name: "nnunet3d"
  in_channels: 1
  base_filters: 32
  deep_supervision: true

method:
  name: "urpc"
  base_lr: 0.01
  max_iteration: 15000
  consistency: 1.0
  consistency_rampup: 40.0

data:
  patch_size: [32, 160, 160]
  batch_size: 4
  labeled_bs: 2
  labelnum: 15

logging:
  val_step_size: 0.5
