# Experiment Preset: BHSD Multi-Class FixMatch 3D (Fold 0)
experiment:
  name: "bhsd_fixmatch_fold0"
  task: "multiclass"
  num_classes: 6
  fold: 0
  seed: 1337
  deterministic: true

dataset: "bhsd_multiclass"

model:
  name: "vnet"
  in_channels: 1

method:
  name: "fixmatch"
  base_lr: 0.01
  max_iteration: 15000
  conf_threshold: 0.95
  u_weight: 1.0
  consistency_rampup: 4000.0

data:
  patch_size: [32, 160, 160]
  batch_size: 4
  labeled_bs: 2
  labelnum: 15

logging:
  val_step_size: 0.5
