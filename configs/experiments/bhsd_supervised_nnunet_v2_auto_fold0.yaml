# Experiment Preset: BHSD Multi-Class Supervised Benchmark matching nnU-Net v2 PlainConvUNet (Auto-Spacing)
# Derived from nnUNetv2 ExperimentPlanner for BHSD 192 labeled cases:
#   - Auto target_spacing: [2.7148, 0.4883, 0.4883] mm (median_shape [61, 512, 512] from nnUNetPlans_16GB_T4 / 15GB_T4)
#   - 16 GB T4 VRAM target (2x T4 DDP splits global batch_size=2 -> 1 sample/GPU)
#   - Exact PlainConvUNet parity: strided_conv_in_block=true, conv_bias=true, InstanceNorm3d, LeakyReLU
# Note: For 8 GB VRAM default nnU-Net plan, use num_stages=6, patch_size=[32, 256, 224], and 5 pool_strides.

experiment:
  name: "bhsd_supervised_nnunet_v2_auto_fold0"
  task: "multiclass"
  num_classes: 6
  fold: 0
  seed: 1337
  deterministic: true
  phase: "all"

dataset: "bhsd_multiclass"

model:
  name: "nnunet3d"
  in_channels: 1
  base_filters: 32
  max_filters: 320
  num_stages: 7
  has_dropout: false
  deep_supervision: true
  anisotropic_kernels: true
  use_strided_conv: true
  conv_bias: true
  strided_conv_in_block: true
  stage_kernels:
    - [1, 3, 3]
    - [1, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
    - [3, 3, 3]
  pool_strides:
    - [1, 2, 2]
    - [1, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
    - [1, 2, 2]

method:
  name: "supervised"
  optimizer: "sgd"
  base_lr: 0.01
  momentum: 0.99
  nesterov: true
  weight_decay: 0.00003
  lr_scheduler: "poly"
  poly_power: 0.9
  clip_norm: 12.0
  max_iteration: 25000
  deep_supervision: true
  ds_zero_lowest_scale: true
  ds_downsample_target: true
  batch_dice: false

data:
  patch_size: [32, 320, 320]
  batch_size: 2
  labeled_bs: 2
  labelnum: 154
  max_samples: 154
  labeled_sampling: "first"
  foreground_prob: 0.33
  aug_preset: "nnunet"
  extended_aug: true

logging:
  val_interval: 500
  val_step_size: 0.5
  val_gaussian: true
  val_amp: true
