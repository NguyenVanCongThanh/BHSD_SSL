# Experiment Preset: BHSD Binary Supervised with 5-Stage Classic Residual V-Net (has_residual=true)
# Milletari-style residual 5-stage V-Net baseline (9,500 iters) with 16x-divisible patch [32, 256, 256].

experiment:
  name: "bhsd_supervised_vnet5_res_fold0"
  task: "binary"
  num_classes: 2
  fold: 0
  seed: 1337
  deterministic: true
  phase: "all"

dataset: "bhsd_binary"

model:
  name: "vnet"
  in_channels: 1
  n_filters: 16
  num_stages: 5
  normalization: "instancenorm"
  has_dropout: false
  has_residual: true

method:
  name: "supervised"
  base_lr: 0.01
  max_iteration: 9500

data:
  patch_size: [32, 256, 256]
  batch_size: 4
  labeled_bs: 4
  labelnum: 154
  max_samples: 154
  labeled_sampling: "first"
  extended_aug: true

logging:
  val_interval: 500
  val_step_size: 0.5
