# Experiment Preset: BHSD Binary LeFeD with 5-Stage InstanceNorm Anisotropic V-Net (Fold 0)
# Fair 1:1 SSL benchmark aligned with vnet5_plain supervised runs:
# - Anisotropic 5-stage encoder/decoder (bottleneck Z=8, LeakyReLU, concat skips, Kaiming init)
# - Foreground-only MaskDiceLoss, balanced dual-decoder supervised loss, finest->coarsest DS
# - Gradient-accumulated feedback passes (1 optimizer step & 1 DDP sync per iter) with meaningful consistency weight
experiment:
  name: "bhsd_lefed_vnet5_binary_fold0"
  task: "binary"
  num_classes: 2
  fold: 0
  seed: 1337
  deterministic: true
  phase: "all"
  amp: true

dataset: "bhsd_binary"

model:
  name: "lefed_net"
  in_channels: 1
  n_filters: 16
  normalization: "instancenorm"
  anisotropic_kernels: true
  activation: "leaky_relu"
  skip_mode: "concat"
  has_dropout: true
  dropout_prob: 0.15
  has_residual: false
  eval_ensemble: true
  gradient_checkpointing: true

method:
  name: "lefed"
  max_iteration: 15000
  lr_max_iteration: 15000
  base_lr: 0.01
  lr_scheduler: "poly"
  batch_dice: true
  consistency: 0.5
  consistency_rampup: 2500.0
  consistency_rampdown_start: 11000
  consistency_min_factor: 0.25
  consistency_type: "hybrid"
  consistency_dice_weight: 0.8
  consistency_mse_weight: 0.2
  bg_consistency_weight: 0.05
  confidence_thresh: 0.0
  feedback_steps: 2
  feedback_scale: 0.001
  feedback_update_mode: "accumulate"
  ds_weights: [0.5, 0.25, 0.125, 0.0625, 0.03125]
  ds_loss_weight: 0.5
  ds_downsample_target: true
  ds_zero_lowest_scale: true

data:
  name: "bhsd"
  task: "binary"
  num_classes: 2
  class_names:
    - "Background"
    - "Hemorrhage"
  patch_size: [32, 256, 256]
  batch_size: 8
  labeled_bs: 4
  labelnum: 8
  max_samples: 154
  labeled_sampling: "stratified"
  extended_aug: true

logging:
  val_interval: 500
  save_interval: 1000
  val_step_size: 0.5
  val_eval_space: "preprocessed"
  val_gaussian: true
  val_amp: true
  val_visualize: true
  num_vis_samples: 4
  use_wandb: true
  save_wandb_model: true
  wandb_project: "BHSD_LeFeD"
