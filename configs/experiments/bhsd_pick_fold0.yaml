# Experiment Preset: BHSD Multi-Class PICK (Fold 0)
experiment:
  name: "bhsd_pick_fold0"
  task: "multiclass"
  num_classes: 6
  fold: 0
  seed: 1337
  deterministic: true
  phase: "all"

dataset: "bhsd_multiclass"

model:
  name: "vnet"
  in_channels: 1
  normalization: "batchnorm"
  has_dropout: true

method:
  name: "pick"
  base_lr: 0.01
  pre_max_iteration: 4000
  self_max_iteration: 12000
  lambda_mim: 0.2
  mask_ratio: 0.666667

data:
  patch_size: [32, 160, 160]
  batch_size: 4
  labeled_bs: 2
  labelnum: 15

